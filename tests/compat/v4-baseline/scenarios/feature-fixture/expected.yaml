# Expected observable contract for feature-fixture
# Captured 2026-05-05 against pipeline v4.10.0 (Wave 3 — Compat Baselines)
# Cross-reference: skills/feature-light/SKILL.md + agents/executor/type-specific/feature-* + commands/pipeline.md
# Per implement-light.md:107 (deprecated but normative): feature-integration-validator SKIPPED in Light.

baseline_version: "4.10.0"
baseline_captured_at: "2026-05-05T00:00:00Z"
baseline_method: "REAL — captured 2026-05-05 by Claude Opus 4.7 dogfooding session against input.md. Validated cross-reference vs references/pipelines/implement-light.md (deprecated but normative for team-composition) + skills/feature-light/SKILL.md + agents/executor/type-specific/feature-{vertical-slice-planner,implementer} contracts."

classification:
  type: feature
  complexity: MEDIA
  pipeline_variant: feature-light    # MEDIA + 1 user story = light per §10.1

gates_triggered:
  - gate: INFO_GATE_BLOCKED
    hardness: HARD
    decision: PASS
  - gate: TDD_APPROVAL
    hardness: HARD
    decision: PASS
  - gate: ADVERSARIAL_GATE_MANDATORY    # auth + data-model domains
    hardness: MANDATORY
    decision: PASS
  - gate: CHECKPOINT_FAIL
    hardness: HARD
    decision: PASS                       # checkpoint passou
  - gate: FINAL_ADVERSARIAL_GATE
    hardness: SOFT
    decision: PASS
  - gate: CLOSEOUT_CONFIRM
    hardness: SOFT
    decision: PASS

agents_invoked:
  # feature-light per implement-light.md team + Type-Specific Agent Team
  # NOTE: feature-integration-validator SKIPPED in Light (handled inline by checkpoint-validator)
  - task-orchestrator
  - sentinel                              # ORCHESTRATOR_VALIDATION + phase_2_to_3
  - information-gate
  - quality-gate-router                   # TDD scenarios approval
  - pre-tester                            # RED tests
  - executor-controller
  - feature-vertical-slice-planner        # Type-Specific Team agent #1
  - feature-implementer                   # Type-Specific Team agent #2
  - executor-spec-reviewer
  - executor-quality-reviewer
  - checkpoint-validator
  - review-orchestrator                   # adversarial gate per-batch
  - adversarial-batch
  - architecture-reviewer
  - sanity-checker
  - final-adversarial-orchestrator
  - final-validator

artifacts_produced:
  - PIPELINE_DOC_PATH/sentinel-state.json
  - PIPELINE_DOC_PATH/gate-decisions.jsonl
  - PIPELINE_DOC_PATH/confidence-score.yaml
  - PIPELINE_DOC_PATH/01-task-orchestrator.md
  - PIPELINE_DOC_PATH/02-information-gate.md
  - PIPELINE_DOC_PATH/03-quality-gate-router.md
  - PIPELINE_DOC_PATH/04-pre-tester.md
  - PIPELINE_DOC_PATH/05-executor-controller.md
  - PIPELINE_DOC_PATH/06-feature-vertical-slice-planner.md
  - PIPELINE_DOC_PATH/07-review-orchestrator.md
  - PIPELINE_DOC_PATH/08-sanity-checker.md
  - PIPELINE_DOC_PATH/09-final-validator.md

verdict: GO

ignore:
  - "exact wall-clock duration_seconds"
  - "exact agent prose / reasoning"
  - "exact PIPELINE_DOC_PATH timestamp"
  - "ordering within parallel adversarial reviewers"

must_match:
  - "classification.type, complexity, pipeline_variant"
  - "set of gates_triggered (presence, hardness, decision PASS/FAIL/SKIPPED)"
  - "set of agents_invoked (presence — order is best-effort, not strict)"
  - "set of artifacts_produced (basenames only)"
  - "verdict (GO / CONDITIONAL / NO-GO)"
