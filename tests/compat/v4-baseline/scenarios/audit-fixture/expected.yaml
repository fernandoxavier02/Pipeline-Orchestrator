# Expected observable contract for audit-fixture
# Captured 2026-05-05 against pipeline v4.10.0 (Wave 3 — Compat Baselines)
# Cross-reference: references/pipelines/audit-light.md + agents/executor/type-specific/audit-* + commands/pipeline.md report-only Iron Law (§22.4)

baseline_version: "4.10.0"
baseline_captured_at: "2026-05-05T00:00:00Z"
baseline_method: "REAL — captured 2026-05-05 by Claude Opus 4.7 dogfooding session against input.md. Validated cross-reference vs references/pipelines/audit-light.md + agents/executor/type-specific/audit-* contracts. Per audit-light Phase 3 Note: final-adversarial-orchestrator SKIPPED (zero code review surface)."

classification:
  type: audit
  complexity: MEDIA
  pipeline_variant: audit-light    # 1 area = auth/, 1 nivel profundidade per §10.1

gates_triggered:
  - gate: INFO_GATE_BLOCKED
    hardness: HARD
    decision: PASS
  - gate: ADVERSARIAL_GATE_MANDATORY    # auth domain
    hardness: MANDATORY
    decision: PASS
  - gate: FINAL_ADVERSARIAL_GATE
    hardness: SOFT
    decision: SKIPPED                    # report-only pipeline per audit-light Phase 3 Note
  - gate: CLOSEOUT_CONFIRM
    hardness: SOFT
    decision: PASS

# NOTE: TDD_APPROVAL and CHECKPOINT_FAIL ABSENT — audit is report-only per §22.4 Iron Law.

agents_invoked:
  # Per references/pipelines/audit-light.md team composition + Type-Specific Agent Team
  - task-orchestrator
  - sentinel                              # ORCHESTRATOR_VALIDATION + phase_2_to_3 (set-deduped)
  - information-gate
  - executor-controller                   # dispatches audit steps (READ-ONLY)
  - audit-intake                          # step 1
  - audit-compliance-checker              # steps 2-8 (light_mode)
  - audit-risk-matrix-generator           # step 9 — Pa de Cal report
  - sanity-checker                        # report completeness check
  - final-validator

artifacts_produced:
  - PIPELINE_DOC_PATH/sentinel-state.json
  - PIPELINE_DOC_PATH/gate-decisions.jsonl
  - PIPELINE_DOC_PATH/confidence-score.yaml
  - PIPELINE_DOC_PATH/01-task-orchestrator.md
  - PIPELINE_DOC_PATH/02-information-gate.md
  - PIPELINE_DOC_PATH/03-audit-intake.md
  - PIPELINE_DOC_PATH/04-audit-compliance-checker.md
  - PIPELINE_DOC_PATH/05-audit-risk-matrix-generator.md
  - PIPELINE_DOC_PATH/06-final-validator.md
  - PIPELINE_DOC_PATH/AuditSnapshot.md           # §22.3 step 1 output (light)
  - PIPELINE_DOC_PATH/AuditFinalSeal.md          # §22.3 step 9 output (light)

verdict: GO    # audit completes; CONDITIONAL only if findings are critical (this fixture: GO baseline)

# Iron Law check (CRITICAL — never in ignore, must always verify):
iron_law_assertions:
  - "no production file modified during run (only PIPELINE_DOC_PATH/* writes)"
  - "no Bash command with destructive operators (rm, mv, >, >>)"
  - "all step outputs declare report_only: true em frontmatter"

ignore:
  - "exact wall-clock duration_seconds"
  - "exact AuditSnapshot/AuditFinalSeal content (prose findings)"
  - "exact PIPELINE_DOC_PATH timestamp"

must_match:
  - "classification.type, complexity, pipeline_variant"
  - "set of gates_triggered (presence, hardness, decision)"
  - "set of agents_invoked (presence)"
  - "set of artifacts_produced (basenames only)"
  - "verdict"
  - "iron_law_assertions ALL true"
