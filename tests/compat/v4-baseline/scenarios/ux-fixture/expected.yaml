# Expected observable contract for ux-fixture
# Captured 2026-05-05 against pipeline v4.10.0 (Wave 3 — Compat Baselines)
# Cross-reference: references/pipelines/ux-sim-light.md + agents/executor/type-specific/ux-{simulator,qa-validator}
# Per ux-sim-light Phase 3 Note: report-only pipeline → final-adversarial-orchestrator SKIPPED (zero code review surface).

baseline_version: "4.10.0"
baseline_captured_at: "2026-05-05T00:00:00Z"
baseline_method: "REAL — captured 2026-05-05 by Claude Opus 4.7 dogfooding session against input.md. Validated cross-reference vs references/pipelines/ux-sim-light.md team composition + Type-Specific Agent Team (ux-simulator, ux-qa-validator). ux-accessibility-auditor SKIPPED in Light per spec."

classification:
  type: ux
  complexity: MEDIA
  pipeline_variant: ux-light    # 1 persona, 1 jornada, top-3 frictions per §10.1

gates_triggered:
  - gate: INFO_GATE_BLOCKED
    hardness: HARD
    decision: PASS
  - gate: ADVERSARIAL_GATE          # SOFT — domain non-sensitive (docs/onboarding)
    hardness: SOFT
    decision: SKIPPED                # commonly skipped on UX exploratory
  - gate: FINAL_ADVERSARIAL_GATE
    hardness: SOFT
    decision: SKIPPED                # report-only, declined per ux-sim-light Phase 3 Note
  - gate: CLOSEOUT_CONFIRM
    hardness: SOFT
    decision: PASS

# NOTE: TDD_APPROVAL ABSENT — ux is exploratory per §7.2.4 (TDD nao se aplica).
# CHECKPOINT_FAIL ABSENT — no code changes.

agents_invoked:
  # Per references/pipelines/ux-sim-light.md team composition + Type-Specific Agent Team
  - task-orchestrator
  - sentinel                              # ORCHESTRATOR_VALIDATION + phase_2_to_3
  - information-gate
  - executor-controller
  - ux-simulator                          # Type-Specific Team agent #1 (journey walk + friction catalog)
  - ux-qa-validator                       # Type-Specific Team agent #2 (consolidates per ux-qa-validator role)
  - sanity-checker                        # report completeness check
  - final-validator

artifacts_produced:
  - PIPELINE_DOC_PATH/sentinel-state.json
  - PIPELINE_DOC_PATH/gate-decisions.jsonl
  - PIPELINE_DOC_PATH/confidence-score.yaml
  - PIPELINE_DOC_PATH/01-task-orchestrator.md
  - PIPELINE_DOC_PATH/02-information-gate.md
  - PIPELINE_DOC_PATH/03-ux-simulator.md
  - PIPELINE_DOC_PATH/04-ux-qa-validator.md
  - PIPELINE_DOC_PATH/05-final-validator.md
  - PIPELINE_DOC_PATH/friction-catalog.md         # §7.2.4 output característico
  - PIPELINE_DOC_PATH/improvement-proposals.md    # §7.2.4 output característico

verdict: GO    # exploratory — sempre GO se persona+jornada definidos

ignore:
  - "exact wall-clock duration_seconds"
  - "exact friction-catalog content (prose findings)"
  - "exact improvement-proposals content"
  - "exact PIPELINE_DOC_PATH timestamp"
  - "ordering within ux-simulator persona walk steps"

must_match:
  - "classification.type, complexity, pipeline_variant"
  - "set of gates_triggered (presence, hardness, decision)"
  - "set of agents_invoked (presence)"
  - "set of artifacts_produced (basenames only — esp friction-catalog + improvement-proposals)"
  - "verdict"
