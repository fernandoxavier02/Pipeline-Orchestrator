# Expected observable contract for bugfix-fixture
# Captured 2026-05-05 against pipeline v4.10.0 (Wave 3 — Compat Baselines)
# Cross-reference: commands/pipeline.md + references/pipelines/bugfix-light.md + agents/executor/type-specific/

baseline_version: "4.10.0"
baseline_captured_at: "2026-05-05T00:00:00Z"
baseline_method: "REAL — captured 2026-05-05 by Claude Opus 4.7 dogfooding session against input.md. Validated cross-reference vs references/pipelines/bugfix-light.md + agents/executor/* + commands/pipeline.md HOTFIX/normal flow."

classification:
  type: bugfix
  complexity: MEDIA
  pipeline_variant: bugfix-light    # MEDIA + auth domain → light variant w/ mandatory adversarial

gates_triggered:
  # Cronological order — see references/gates.md Registry for hardness levels
  - gate: INFO_GATE_BLOCKED
    hardness: HARD
    decision: PASS
  - gate: TDD_APPROVAL
    hardness: HARD
    decision: PASS
  - gate: ADVERSARIAL_GATE_MANDATORY    # auth domain triggers MANDATORY hardness per gate registry
    hardness: MANDATORY
    decision: PASS
  - gate: CHECKPOINT_FAIL               # gate name from registry; decision PASS = checkpoint passed
    hardness: HARD
    decision: PASS
  - gate: FINAL_ADVERSARIAL_GATE
    hardness: SOFT
    decision: PASS                       # opt-in but recommended for auth touch
  - gate: CLOSEOUT_CONFIRM
    hardness: SOFT
    decision: PASS

agents_invoked:
  # bugfix-light per references/pipelines/bugfix-light.md team composition
  - task-orchestrator
  - sentinel                   # ORCHESTRATOR_VALIDATION + phase_2_to_3 (set-deduped by runner)
  - information-gate
  - quality-gate-router        # TDD scenarios
  - pre-tester                 # RED tests
  - executor-controller
  - executor-implementer-task  # batch of 2-3 (MEDIA)
  - executor-spec-reviewer
  - executor-quality-reviewer
  - checkpoint-validator
  - review-orchestrator        # adversarial gate per-batch
  - adversarial-batch
  - architecture-reviewer
  - bugfix-diagnostic-agent    # type-specific per bugfix-light §Type-Specific Agent Team
  - executor-fix               # fix loop wiring
  - bugfix-regression-tester   # post-fix validation
  - sanity-checker
  - final-adversarial-orchestrator
  - final-validator

artifacts_produced:
  # Filenames only — runner uses path.basename() for set comparison
  - PIPELINE_DOC_PATH/sentinel-state.json
  - PIPELINE_DOC_PATH/gate-decisions.jsonl
  - PIPELINE_DOC_PATH/confidence-score.yaml
  - PIPELINE_DOC_PATH/01-task-orchestrator.md
  - PIPELINE_DOC_PATH/02-information-gate.md
  - PIPELINE_DOC_PATH/03-quality-gate-router.md
  - PIPELINE_DOC_PATH/04-pre-tester.md
  - PIPELINE_DOC_PATH/05-executor-controller.md
  - PIPELINE_DOC_PATH/06-review-orchestrator.md
  - PIPELINE_DOC_PATH/07-sanity-checker.md
  - PIPELINE_DOC_PATH/08-final-validator.md

verdict: GO    # build + tests + adversarial all clean per fixture description

# Tolerances — what the runner SHOULD ignore
ignore:
  - "exact wall-clock duration_seconds"
  - "exact agent prose / reasoning"
  - "exact PIPELINE_DOC_PATH timestamp"
  - "ordering within parallel adversarial reviewers"

# What the runner MUST verify
must_match:
  - "classification.type, complexity, pipeline_variant"
  - "set of gates_triggered (presence, hardness, decision PASS/FAIL/SKIPPED)"
  - "set of agents_invoked (presence — order is best-effort, not strict)"
  - "set of artifacts_produced (basenames only)"
  - "verdict (GO / CONDITIONAL / NO-GO)"
