<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="100%" font-family="'Segoe UI', Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.22"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="620" fill="url(#bg)" rx="14"/>
  <rect width="1280" height="620" fill="url(#grid)" rx="14"/>

  <!-- Title -->
  <text x="640" y="54" text-anchor="middle" fill="#F0F6FC" font-size="34" font-weight="800" letter-spacing="0.5">The Gate System — 49 Checkpoints</text>
  <text x="640" y="86" text-anchor="middle" fill="#8B949E" font-size="17">Every phase transition crosses a gate. Five hardness levels define whether it blocks, asks, or merely records.</text>

  <!-- Big counter -->
  <g transform="translate(640,150)">
    <rect x="-110" y="-34" width="220" height="68" rx="16" fill="#1a1228" stroke="#7C3AED" stroke-width="2" filter="url(#soft)"/>
    <text x="0" y="6" text-anchor="middle" font-size="34" font-weight="800" fill="url(#tg)" letter-spacing="1">49 GATES</text>
    <defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#F0ABFC"/></linearGradient></defs>
  </g>

  <!-- Severity pyramid (5 tiers, narrowing) -->
  <!-- Tier widths decrease; all centered at x=640 -->
  <g filter="url(#soft)">
    <!-- MANDATORY (top, hardest) -->
    <rect x="440" y="206" width="400" height="56" rx="8" fill="#2a1018" stroke="#EF4444" stroke-width="2">
      <animate attributeName="stroke-width" values="2;3;2" dur="4s" repeatCount="indefinite"/>
    </rect>
    <!-- HARD -->
    <rect x="370" y="270" width="540" height="56" rx="8" fill="#231b06" stroke="#F59E0B" stroke-width="2"/>
    <!-- CIRCUIT_BREAKER -->
    <rect x="300" y="334" width="680" height="56" rx="8" fill="#2a1018" stroke="#F97316" stroke-width="2"/>
    <!-- SOFT -->
    <rect x="230" y="398" width="820" height="56" rx="8" fill="#0c2117" stroke="#22C55E" stroke-width="2"/>
    <!-- AUDIT -->
    <rect x="160" y="462" width="960" height="56" rx="8" fill="#0c1a2e" stroke="#0EA5E9" stroke-width="2"/>
  </g>

  <!-- Tier labels + behavior -->
  <g text-anchor="middle">
    <text x="640" y="230" fill="#F87171" font-size="16" font-weight="800" letter-spacing="1.5">MANDATORY</text>
    <text x="640" y="250" fill="#FCA5A5" font-size="12.5">never bypassed — not even by --hotfix · structural integrity + domain-mandated security</text>

    <text x="640" y="294" fill="#FBBF24" font-size="16" font-weight="800" letter-spacing="1.5">HARD</text>
    <text x="640" y="314" fill="#FCD34D" font-size="12.5">blocks until resolved · clear resolution path (answer, approve, fix)</text>

    <text x="640" y="358" fill="#FB923C" font-size="16" font-weight="800" letter-spacing="1.5">CIRCUIT_BREAKER</text>
    <text x="640" y="378" fill="#FDBA74" font-size="12.5">halts after N consecutive failures · requires explicit reset</text>

    <text x="640" y="422" fill="#34D399" font-size="16" font-weight="800" letter-spacing="1.5">SOFT</text>
    <text x="640" y="442" fill="#6EE7B7" font-size="12.5">recommended · skippable with explicit ack (logged, confidence penalty)</text>

    <text x="640" y="486" fill="#38BDF8" font-size="16" font-weight="800" letter-spacing="1.5">AUDIT</text>
    <text x="640" y="506" fill="#7DD3FC" font-size="12.5">informational telemetry · never blocks · first-class audit-trail row</text>
  </g>

  <!-- Footer: deterministic enforcement note -->
  <g transform="translate(640,548)">
    <rect x="-560" y="0" width="1120" height="48" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="-528" cy="24" r="6" fill="#A78BFA">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="-510" y="29" fill="#C9D1D9" font-size="14" font-weight="600">v8.5–v8.9: prompt-only flow rules are now deterministic DENY gates — the agent physically cannot advance past a red build, an unresolved info gap, or a NO-GO.</text>
  </g>

  <!-- Corner accents -->
  <g stroke="#7C3AED" stroke-width="2" fill="none" opacity="0.55">
    <path d="M 24 24 L 24 56 M 24 24 L 56 24"/>
    <path d="M 1256 24 L 1256 56 M 1256 24 L 1224 24"/>
    <path d="M 24 596 L 24 564 M 24 596 L 56 596"/>
    <path d="M 1256 596 L 1256 564 M 1256 596 L 1224 596"/>
  </g>
</svg>
