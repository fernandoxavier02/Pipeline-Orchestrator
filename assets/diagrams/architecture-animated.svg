<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1100" width="100%">
  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <pattern id="archGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.6" opacity="0.3"/>
    </pattern>
    <filter id="archShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <filter id="archGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="1100" fill="url(#archBg)" rx="14"/>
  <rect width="1200" height="1100" fill="url(#archGrid)" rx="14"/>

  <!-- TITLE -->
  <text x="600" y="68" text-anchor="middle" fill="#f0f6fc" font-size="44" font-weight="800" letter-spacing="1.5" font-family="'Segoe UI',system-ui,sans-serif">Agent Architecture — 20 Production Agents</text>
  <text x="600" y="108" text-anchor="middle" fill="#8b949e" font-size="22" font-family="'Segoe UI',system-ui,sans-serif">Four layers · clean responsibility boundaries · v6.3.0</text>
  <line x1="320" y1="128" x2="880" y2="128" stroke="#7C3AED" stroke-width="3" opacity="0.55">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- ===== LAYER 1: CORE ORCHESTRATION ===== -->
  <g>
    <rect x="40" y="170" width="1120" height="180" rx="12" fill="#1e1b4b" stroke="#7C3AED" stroke-width="3" filter="url(#archShadow)">
      <animate attributeName="stroke-width" values="3;4.5;3" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="70" y="208" fill="#7C3AED" font-size="26" font-weight="800" letter-spacing="2" font-family="'Segoe UI',system-ui,sans-serif">CORE ORCHESTRATION</text>
    <text x="70" y="234" fill="#a5b4fc" font-size="17" font-family="'Segoe UI',system-ui,sans-serif">10 agents · pipeline controller, gates, sentinel, validators</text>

    <!-- 5 agents row 1 -->
    <rect x="70" y="252" width="200" height="38" rx="6" fill="#312e81" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="170" y="276" text-anchor="middle" fill="#e0e7ff" font-size="15" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">pipeline-controller</text>

    <rect x="285" y="252" width="200" height="38" rx="6" fill="#312e81" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="385" y="276" text-anchor="middle" fill="#e0e7ff" font-size="15" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">brainstorm-controller</text>

    <rect x="500" y="252" width="200" height="38" rx="6" fill="#312e81" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="600" y="276" text-anchor="middle" fill="#e0e7ff" font-size="15" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">task-orchestrator</text>

    <rect x="715" y="252" width="200" height="38" rx="6" fill="#312e81" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="815" y="276" text-anchor="middle" fill="#e0e7ff" font-size="15" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">information-gate</text>

    <rect x="930" y="252" width="200" height="38" rx="6" fill="#312e81" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="1030" y="276" text-anchor="middle" fill="#e0e7ff" font-size="15" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">sentinel</text>

    <!-- 5 agents row 2 -->
    <rect x="70" y="300" width="200" height="38" rx="6" fill="#312e81" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="170" y="324" text-anchor="middle" fill="#e0e7ff" font-size="15" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">final-validator</text>

    <rect x="285" y="300" width="200" height="38" rx="6" fill="#312e81" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="385" y="324" text-anchor="middle" fill="#e0e7ff" font-size="15" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">finishing-branch</text>

    <rect x="500" y="300" width="200" height="38" rx="6" fill="#312e81" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="600" y="324" text-anchor="middle" fill="#e0e7ff" font-size="15" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">sanity-checker</text>

    <rect x="715" y="300" width="200" height="38" rx="6" fill="#312e81" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="815" y="324" text-anchor="middle" fill="#e0e7ff" font-size="15" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">checkpoint-validator</text>

    <rect x="930" y="300" width="200" height="38" rx="6" fill="#312e81" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="1030" y="324" text-anchor="middle" fill="#e0e7ff" font-size="15" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">adversarial-batch</text>
  </g>

  <!-- ===== LAYER 2: QUALITY (review + planning) ===== -->
  <g>
    <rect x="40" y="380" width="1120" height="220" rx="12" fill="#3a2a0e" stroke="#F59E0B" stroke-width="3" filter="url(#archShadow)">
      <animate attributeName="stroke-width" values="3;4.5;3" dur="4s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <text x="70" y="418" fill="#F59E0B" font-size="26" font-weight="800" letter-spacing="2" font-family="'Segoe UI',system-ui,sans-serif">QUALITY — REVIEW &amp; PLANNING</text>
    <text x="70" y="444" fill="#fde68a" font-size="17" font-family="'Segoe UI',system-ui,sans-serif">8 agents · planning, design, review, adversarial team</text>

    <rect x="70" y="462" width="200" height="38" rx="6" fill="#422006" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="170" y="486" text-anchor="middle" fill="#fde68a" font-size="15" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">plan-architect</text>

    <rect x="285" y="462" width="200" height="38" rx="6" fill="#422006" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="385" y="486" text-anchor="middle" fill="#fde68a" font-size="15" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">design-interrogator</text>

    <rect x="500" y="462" width="200" height="38" rx="6" fill="#422006" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="600" y="486" text-anchor="middle" fill="#fde68a" font-size="15" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">pre-tester</text>

    <rect x="715" y="462" width="200" height="38" rx="6" fill="#422006" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="815" y="486" text-anchor="middle" fill="#fde68a" font-size="15" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">quality-gate-router</text>

    <rect x="930" y="462" width="200" height="38" rx="6" fill="#422006" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="1030" y="486" text-anchor="middle" fill="#fde68a" font-size="15" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">review-orchestrator</text>

    <rect x="70" y="510" width="200" height="38" rx="6" fill="#422006" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="170" y="534" text-anchor="middle" fill="#fde68a" font-size="15" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">architecture-reviewer</text>

    <!-- NEW v6.3.0 — highlighted -->
    <rect x="285" y="510" width="280" height="38" rx="6" fill="#0c2117" stroke="#22C55E" stroke-width="2">
      <animate attributeName="stroke-width" values="2;3.5;2" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="425" y="534" text-anchor="middle" fill="#86EFAC" font-size="15" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">diff-discipline-reviewer ★ NEW</text>

    <rect x="580" y="510" width="270" height="38" rx="6" fill="#422006" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="715" y="534" text-anchor="middle" fill="#fde68a" font-size="15" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">final-adversarial-orchestrator</text>

    <text x="600" y="582" text-anchor="middle" fill="#fbbf24" font-size="15" font-style="italic" font-family="'Segoe UI',system-ui,sans-serif">3 reviewers spawned in parallel from review-orchestrator — zero implementation context</text>
  </g>

  <!-- ===== LAYER 3: EXECUTOR ===== -->
  <g>
    <rect x="40" y="630" width="1120" height="280" rx="12" fill="#3b0a0a" stroke="#EF4444" stroke-width="3" filter="url(#archShadow)">
      <animate attributeName="stroke-width" values="3;4.5;3" dur="4s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <text x="70" y="668" fill="#EF4444" font-size="26" font-weight="800" letter-spacing="2" font-family="'Segoe UI',system-ui,sans-serif">EXECUTOR</text>
    <text x="70" y="694" fill="#fecaca" font-size="17" font-family="'Segoe UI',system-ui,sans-serif">6 top-level + 17 type-specific variants · per-batch implementation chain</text>

    <!-- Top-level row -->
    <text x="70" y="724" fill="#FCA5A5" font-size="14" font-weight="700" letter-spacing="1.5" font-family="'Segoe UI',system-ui,sans-serif">TOP-LEVEL (6)</text>

    <rect x="70" y="734" width="170" height="36" rx="6" fill="#5b0e0e" stroke="#EF4444" stroke-width="1.5"/>
    <text x="155" y="757" text-anchor="middle" fill="#fecaca" font-size="14" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">executor-controller</text>

    <rect x="252" y="734" width="200" height="36" rx="6" fill="#5b0e0e" stroke="#EF4444" stroke-width="1.5"/>
    <text x="352" y="757" text-anchor="middle" fill="#fecaca" font-size="14" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">executor-implementer-task</text>

    <rect x="464" y="734" width="160" height="36" rx="6" fill="#5b0e0e" stroke="#EF4444" stroke-width="1.5"/>
    <text x="544" y="757" text-anchor="middle" fill="#fecaca" font-size="14" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">executor-fix</text>

    <rect x="636" y="734" width="180" height="36" rx="6" fill="#5b0e0e" stroke="#EF4444" stroke-width="1.5"/>
    <text x="726" y="757" text-anchor="middle" fill="#fecaca" font-size="14" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">executor-spec-reviewer</text>

    <rect x="828" y="734" width="200" height="36" rx="6" fill="#5b0e0e" stroke="#EF4444" stroke-width="1.5"/>
    <text x="928" y="757" text-anchor="middle" fill="#fecaca" font-size="14" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">executor-quality-reviewer</text>

    <rect x="1040" y="734" width="100" height="36" rx="6" fill="#5b0e0e" stroke="#EF4444" stroke-width="1.5"/>
    <text x="1090" y="757" text-anchor="middle" fill="#fecaca" font-size="14" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">spec-closer</text>

    <!-- Type-specific row -->
    <text x="70" y="804" fill="#FCA5A5" font-size="14" font-weight="700" letter-spacing="1.5" font-family="'Segoe UI',system-ui,sans-serif">TYPE-SPECIFIC VARIANTS (17)</text>

    <rect x="70" y="814" width="200" height="76" rx="6" fill="#2a0606" stroke="#EF4444" stroke-width="1.5"/>
    <text x="170" y="838" text-anchor="middle" fill="#FCA5A5" font-size="14" font-weight="800" font-family="'Segoe UI',system-ui,sans-serif">FEATURE</text>
    <text x="170" y="858" text-anchor="middle" fill="#fecaca" font-size="13" font-family="'Segoe UI',system-ui,sans-serif">slice-planner · implementer</text>
    <text x="170" y="876" text-anchor="middle" fill="#fecaca" font-size="13" font-family="'Segoe UI',system-ui,sans-serif">integration-validator</text>

    <rect x="285" y="814" width="200" height="76" rx="6" fill="#2a0606" stroke="#EF4444" stroke-width="1.5"/>
    <text x="385" y="838" text-anchor="middle" fill="#FCA5A5" font-size="14" font-weight="800" font-family="'Segoe UI',system-ui,sans-serif">BUGFIX</text>
    <text x="385" y="858" text-anchor="middle" fill="#fecaca" font-size="13" font-family="'Segoe UI',system-ui,sans-serif">diagnostic · root-cause</text>
    <text x="385" y="876" text-anchor="middle" fill="#fecaca" font-size="13" font-family="'Segoe UI',system-ui,sans-serif">regression-tester</text>

    <rect x="500" y="814" width="200" height="76" rx="6" fill="#2a0606" stroke="#EF4444" stroke-width="1.5"/>
    <text x="600" y="838" text-anchor="middle" fill="#FCA5A5" font-size="14" font-weight="800" font-family="'Segoe UI',system-ui,sans-serif">AUDIT (report-only)</text>
    <text x="600" y="858" text-anchor="middle" fill="#fecaca" font-size="13" font-family="'Segoe UI',system-ui,sans-serif">intake · domain-analyzer</text>
    <text x="600" y="876" text-anchor="middle" fill="#fecaca" font-size="13" font-family="'Segoe UI',system-ui,sans-serif">compliance · risk-matrix</text>

    <rect x="715" y="814" width="200" height="76" rx="6" fill="#2a0606" stroke="#EF4444" stroke-width="1.5"/>
    <text x="815" y="838" text-anchor="middle" fill="#FCA5A5" font-size="14" font-weight="800" font-family="'Segoe UI',system-ui,sans-serif">UX SIM (report-only)</text>
    <text x="815" y="858" text-anchor="middle" fill="#fecaca" font-size="13" font-family="'Segoe UI',system-ui,sans-serif">simulator · a11y-auditor</text>
    <text x="815" y="876" text-anchor="middle" fill="#fecaca" font-size="13" font-family="'Segoe UI',system-ui,sans-serif">qa-validator</text>

    <rect x="930" y="814" width="200" height="76" rx="6" fill="#2a0606" stroke="#EF4444" stroke-width="1.5"/>
    <text x="1030" y="838" text-anchor="middle" fill="#FCA5A5" font-size="14" font-weight="800" font-family="'Segoe UI',system-ui,sans-serif">ADVERSARIAL (4)</text>
    <text x="1030" y="858" text-anchor="middle" fill="#fecaca" font-size="13" font-family="'Segoe UI',system-ui,sans-serif">security · architecture</text>
    <text x="1030" y="876" text-anchor="middle" fill="#fecaca" font-size="13" font-family="'Segoe UI',system-ui,sans-serif">quality · coordinator</text>
  </g>

  <!-- ===== LAYER 4: BRAINSTORM STEPS ===== -->
  <g>
    <rect x="40" y="940" width="1120" height="110" rx="12" fill="#0e1f33" stroke="#0EA5E9" stroke-width="3" filter="url(#archShadow)">
      <animate attributeName="stroke-width" values="3;4.5;3" dur="4s" begin="3s" repeatCount="indefinite"/>
    </rect>
    <text x="70" y="978" fill="#0EA5E9" font-size="26" font-weight="800" letter-spacing="2" font-family="'Segoe UI',system-ui,sans-serif">BRAINSTORM STEPS</text>
    <text x="70" y="1004" fill="#bae6fd" font-size="17" font-family="'Segoe UI',system-ui,sans-serif">3 step agents · pre-execution preparation (Kiro-clone integrated)</text>

    <rect x="540" y="965" width="180" height="38" rx="6" fill="#0c1e2e" stroke="#0EA5E9" stroke-width="1.5"/>
    <text x="630" y="989" text-anchor="middle" fill="#bae6fd" font-size="15" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">step-00-intake</text>

    <rect x="730" y="965" width="180" height="38" rx="6" fill="#0c1e2e" stroke="#0EA5E9" stroke-width="1.5"/>
    <text x="820" y="989" text-anchor="middle" fill="#bae6fd" font-size="15" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">step-01-explore</text>

    <rect x="920" y="965" width="220" height="38" rx="6" fill="#0c1e2e" stroke="#0EA5E9" stroke-width="1.5"/>
    <text x="1030" y="989" text-anchor="middle" fill="#bae6fd" font-size="15" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">step-01b-alternatives</text>
  </g>

  <!-- FOOTER -->
  <text x="600" y="1083" text-anchor="middle" fill="#a8b3c7" font-size="16" font-style="italic" font-family="'Segoe UI',system-ui,sans-serif">Reviewers never see the implementer's reasoning. Context isolation is enforced at every spawn.</text>
</svg>
