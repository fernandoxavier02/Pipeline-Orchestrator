<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" width="100%">
  <defs>
    <linearGradient id="gfBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <pattern id="gfGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.25"/>
    </pattern>
    <filter id="gfGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="gfShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <marker id="gfArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7C3AED"/>
    </marker>
    <marker id="gfArrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22C55E"/>
    </marker>
  </defs>

  <rect width="1400" height="720" fill="url(#gfBg)" rx="12"/>
  <rect width="1400" height="720" fill="url(#gfGrid)" rx="12"/>

  <!-- TITLE -->
  <text x="700" y="48" text-anchor="middle" fill="#f0f6fc" font-size="32" font-weight="700" letter-spacing="1.5" font-family="'Segoe UI',system-ui,sans-serif">PIPELINE ORCHESTRATOR — GOVERNANCE FLOW</text>
  <text x="700" y="78" text-anchor="middle" fill="#8b949e" font-size="15" font-family="'Segoe UI',system-ui,sans-serif">Five anchors that prevent the drift problem on the left</text>
  <line x1="430" y1="92" x2="970" y2="92" stroke="#7C3AED" stroke-width="2" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- STAGE 1: PLAN -->
  <g>
    <rect x="40" y="160" width="200" height="120" rx="10" fill="#1e1b4b" stroke="#7C3AED" stroke-width="2.5" filter="url(#gfShadow)"/>
    <text x="140" y="190" text-anchor="middle" fill="#C4B5FD" font-size="11" font-weight="700" letter-spacing="1.5">STAGE 1</text>
    <text x="140" y="216" text-anchor="middle" fill="#f0f6fc" font-size="17" font-weight="700">PLAN-ARCHITECT</text>
    <text x="140" y="244" text-anchor="middle" fill="#a5b4fc" font-size="11">Read-only research</text>
    <text x="140" y="260" text-anchor="middle" fill="#a5b4fc" font-size="11">+ task breakdown</text>
  </g>

  <!-- ANCHOR 1: CHANGE_CONTRACT -->
  <g>
    <rect x="285" y="140" width="220" height="160" rx="10" fill="#0c2117" stroke="#22C55E" stroke-width="2.5" filter="url(#gfShadow)">
      <animate attributeName="stroke-width" values="2.5;3.5;2.5" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="395" y="166" text-anchor="middle" fill="#86EFAC" font-size="10" font-weight="700" letter-spacing="1.5">ANCHOR 1</text>
    <text x="395" y="190" text-anchor="middle" fill="#f0f6fc" font-size="17" font-weight="700">CHANGE_CONTRACT</text>
    <text x="395" y="214" text-anchor="middle" fill="#bbf7d0" font-size="11">allowed_files</text>
    <text x="395" y="230" text-anchor="middle" fill="#bbf7d0" font-size="11">forbidden_files</text>
    <text x="395" y="246" text-anchor="middle" fill="#bbf7d0" font-size="11">diff_budget</text>
    <text x="395" y="262" text-anchor="middle" fill="#bbf7d0" font-size="11">forbidden_change_types</text>
    <text x="395" y="282" text-anchor="middle" fill="#86EFAC" font-size="10" font-style="italic">declared before code starts</text>
  </g>

  <!-- arrow plan → contract -->
  <path d="M 240 220 L 285 220" stroke="#7C3AED" stroke-width="2.5" fill="none" marker-end="url(#gfArrow)" filter="url(#gfGlow)"/>

  <!-- STAGE 2: IMPLEMENT -->
  <g>
    <rect x="550" y="160" width="200" height="120" rx="10" fill="#1e1b4b" stroke="#7C3AED" stroke-width="2.5" filter="url(#gfShadow)"/>
    <text x="650" y="190" text-anchor="middle" fill="#C4B5FD" font-size="11" font-weight="700" letter-spacing="1.5">STAGE 2</text>
    <text x="650" y="216" text-anchor="middle" fill="#f0f6fc" font-size="17" font-weight="700">IMPLEMENTER</text>
    <text x="650" y="244" text-anchor="middle" fill="#a5b4fc" font-size="11">Writes code in batches</text>
    <text x="650" y="260" text-anchor="middle" fill="#a5b4fc" font-size="11">(1 task per batch on COMPLEXA)</text>
  </g>

  <!-- arrow contract → implementer -->
  <path d="M 505 220 L 550 220" stroke="#7C3AED" stroke-width="2.5" fill="none" marker-end="url(#gfArrow)" filter="url(#gfGlow)"/>

  <!-- ANCHOR 2: SCOPE LOCK CHECK -->
  <g>
    <rect x="795" y="140" width="220" height="160" rx="10" fill="#0c2117" stroke="#22C55E" stroke-width="2.5" filter="url(#gfShadow)">
      <animate attributeName="stroke-width" values="2.5;3.5;2.5" dur="4s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <text x="905" y="166" text-anchor="middle" fill="#86EFAC" font-size="10" font-weight="700" letter-spacing="1.5">ANCHOR 2</text>
    <text x="905" y="190" text-anchor="middle" fill="#f0f6fc" font-size="17" font-weight="700">SCOPE LOCK CHECK</text>
    <text x="905" y="214" text-anchor="middle" fill="#bbf7d0" font-size="11">Fires before every Write/Edit</text>
    <text x="905" y="230" text-anchor="middle" fill="#bbf7d0" font-size="11">5 contract checks</text>
    <text x="905" y="246" text-anchor="middle" fill="#bbf7d0" font-size="11">Read remains free</text>
    <text x="905" y="262" text-anchor="middle" fill="#bbf7d0" font-size="11">Violation → STOP + ASK</text>
    <text x="905" y="282" text-anchor="middle" fill="#86EFAC" font-size="10" font-style="italic">JS hook + agent prompt</text>
  </g>

  <!-- arrow implementer → scope lock -->
  <path d="M 750 220 L 795 220" stroke="#7C3AED" stroke-width="2.5" fill="none" marker-end="url(#gfArrow)" filter="url(#gfGlow)"/>

  <!-- BATCH OUTPUT -->
  <g>
    <rect x="1060" y="180" width="180" height="80" rx="10" fill="#1f2937" stroke="#7C3AED" stroke-width="2" filter="url(#gfShadow)"/>
    <text x="1150" y="208" text-anchor="middle" fill="#C4B5FD" font-size="11" font-weight="700" letter-spacing="1.5">BATCH</text>
    <text x="1150" y="232" text-anchor="middle" fill="#f0f6fc" font-size="15" font-weight="700">CODE EMITTED</text>
    <text x="1150" y="250" text-anchor="middle" fill="#a5b4fc" font-size="11">tests passing locally</text>
  </g>

  <!-- arrow scope lock → batch -->
  <path d="M 1015 220 L 1060 220" stroke="#7C3AED" stroke-width="2.5" fill="none" marker-end="url(#gfArrow)" filter="url(#gfGlow)"/>

  <!-- ANCHOR 3: 3-WAY PARALLEL REVIEW -->
  <g>
    <rect x="40" y="380" width="1320" height="170" rx="10" fill="#0c2117" stroke="#22C55E" stroke-width="2.5" filter="url(#gfShadow)">
      <animate attributeName="stroke-width" values="2.5;3.5;2.5" dur="4s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <text x="700" y="408" text-anchor="middle" fill="#86EFAC" font-size="11" font-weight="700" letter-spacing="2">ANCHOR 3 — ADVERSARIAL REVIEW (3 PARALLEL AGENTS, ZERO IMPLEMENTATION CONTEXT)</text>

    <!-- Reviewer 1: adversarial-batch -->
    <rect x="80" y="430" width="380" height="105" rx="8" fill="#1a0f2e" stroke="#EC4899" stroke-width="2" filter="url(#gfShadow)"/>
    <text x="270" y="456" text-anchor="middle" fill="#F9A8D4" font-size="11" font-weight="700" letter-spacing="1.5">REVIEWER 1 — SECURITY</text>
    <text x="270" y="476" text-anchor="middle" fill="#f0f6fc" font-size="13" font-weight="600">adversarial-batch</text>
    <text x="270" y="498" text-anchor="middle" fill="#fbcfe8" font-size="10">auth bypass · injection · race conditions</text>
    <text x="270" y="514" text-anchor="middle" fill="#fbcfe8" font-size="10">sensitive data exposure · OWASP</text>

    <!-- Reviewer 2: architecture-reviewer -->
    <rect x="500" y="430" width="380" height="105" rx="8" fill="#0e1f33" stroke="#0EA5E9" stroke-width="2" filter="url(#gfShadow)"/>
    <text x="690" y="456" text-anchor="middle" fill="#7DD3FC" font-size="11" font-weight="700" letter-spacing="1.5">REVIEWER 2 — ARCHITECTURE</text>
    <text x="690" y="476" text-anchor="middle" fill="#f0f6fc" font-size="13" font-weight="600">architecture-reviewer</text>
    <text x="690" y="498" text-anchor="middle" fill="#bae6fd" font-size="10">pattern compliance · SOLID · KISS · DRY</text>
    <text x="690" y="514" text-anchor="middle" fill="#bae6fd" font-size="10">unrelated refactor · public contract drift</text>

    <!-- Reviewer 3: diff-discipline-reviewer (NEW v6.3.0) -->
    <rect x="920" y="430" width="380" height="105" rx="8" fill="#1a2e1a" stroke="#22C55E" stroke-width="2" filter="url(#gfShadow)">
      <animate attributeName="stroke-width" values="2;3.2;2" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="1110" y="456" text-anchor="middle" fill="#86EFAC" font-size="11" font-weight="700" letter-spacing="1.5">REVIEWER 3 — DISCIPLINE (NEW v6.3.0)</text>
    <text x="1110" y="476" text-anchor="middle" fill="#f0f6fc" font-size="13" font-weight="600">diff-discipline-reviewer</text>
    <text x="1110" y="498" text-anchor="middle" fill="#bbf7d0" font-size="10">scope · minimal diff · over-engineering</text>
    <text x="1110" y="514" text-anchor="middle" fill="#bbf7d0" font-size="10">weakened tests · dependency drift</text>
  </g>

  <!-- arrows: batch → 3 reviewers -->
  <path d="M 1150 260 Q 270 320 270 425" stroke="#7C3AED" stroke-width="2" fill="none" marker-end="url(#gfArrow)" opacity="0.7"/>
  <path d="M 1150 260 Q 690 320 690 425" stroke="#7C3AED" stroke-width="2" fill="none" marker-end="url(#gfArrow)" opacity="0.7"/>
  <path d="M 1150 260 L 1110 425" stroke="#7C3AED" stroke-width="2" fill="none" marker-end="url(#gfArrow)" opacity="0.7"/>

  <!-- ANCHOR 4: GATES -->
  <g>
    <rect x="100" y="600" width="320" height="90" rx="10" fill="#0c2117" stroke="#22C55E" stroke-width="2" filter="url(#gfShadow)"/>
    <text x="260" y="624" text-anchor="middle" fill="#86EFAC" font-size="11" font-weight="700" letter-spacing="1.5">ANCHOR 4 — GATE HIERARCHY</text>
    <text x="260" y="648" text-anchor="middle" fill="#f0f6fc" font-size="13" font-weight="700">22 mandatory gates</text>
    <text x="260" y="667" text-anchor="middle" fill="#bbf7d0" font-size="10">MANDATORY · HARD · CIRCUIT_BREAKER · SOFT · AUDIT</text>
    <text x="260" y="682" text-anchor="middle" fill="#bbf7d0" font-size="10">registered, hardness-typed, logged</text>
  </g>

  <!-- ANCHOR 5: TRACE.md -->
  <g>
    <rect x="490" y="600" width="420" height="90" rx="10" fill="#0c2117" stroke="#22C55E" stroke-width="2" filter="url(#gfShadow)"/>
    <text x="700" y="624" text-anchor="middle" fill="#86EFAC" font-size="11" font-weight="700" letter-spacing="1.5">ANCHOR 5 — GLASS-BOX AUDIT TRAIL</text>
    <text x="700" y="648" text-anchor="middle" fill="#f0f6fc" font-size="13" font-weight="700">TRACE.md + gate-decisions.jsonl</text>
    <text x="700" y="667" text-anchor="middle" fill="#bbf7d0" font-size="10">every classification, decision, agent dispatch, fix loop</text>
    <text x="700" y="682" text-anchor="middle" fill="#bbf7d0" font-size="10">HMAC-signed · attachable to PR · standalone validator</text>
  </g>

  <!-- VERDICT -->
  <g>
    <rect x="980" y="600" width="320" height="90" rx="10" fill="#1e1b4b" stroke="#7C3AED" stroke-width="2.5" filter="url(#gfShadow)">
      <animate attributeName="stroke-width" values="2.5;3.5;2.5" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="1140" y="624" text-anchor="middle" fill="#C4B5FD" font-size="11" font-weight="700" letter-spacing="1.5">FINAL VERDICT</text>
    <text x="1140" y="648" text-anchor="middle" fill="#f0f6fc" font-size="13" font-weight="700">GO / CONDITIONAL / NO-GO</text>
    <text x="1140" y="667" text-anchor="middle" fill="#bbf7d0" font-size="10">objective confidence score (0.00-1.00)</text>
    <text x="1140" y="682" text-anchor="middle" fill="#bbf7d0" font-size="10">no gut-feelings, no "looks fine to me"</text>
  </g>

  <!-- bottom anchors flow into verdict -->
  <path d="M 260 600 L 1080 600" stroke="#22C55E" stroke-width="1.5" fill="none" opacity="0.3" stroke-dasharray="3,5"/>
  <path d="M 700 550 L 700 600" stroke="#22C55E" stroke-width="2" fill="none" marker-end="url(#gfArrowGreen)" opacity="0.6"/>
</svg>
