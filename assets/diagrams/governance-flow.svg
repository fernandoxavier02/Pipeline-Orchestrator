<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" font-family="'Segoe UI', Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.22"/>
    </pattern>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0c0a1f"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Shield shape -->
    <symbol id="shield" viewBox="0 0 100 120">
      <path d="M 50 4 L 92 20 L 92 64 Q 92 96 50 116 Q 8 96 8 64 L 8 20 Z"/>
    </symbol>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)" rx="14"/>
  <rect width="1280" height="720" fill="url(#grid)" rx="14"/>

  <!-- Title -->
  <text x="640" y="56" text-anchor="middle" fill="#F0F6FC" font-size="34" font-weight="800" letter-spacing="0.5">Defense in Depth — Five Anchors</text>
  <text x="640" y="88" text-anchor="middle" fill="#8B949E" font-size="17">Each anchor is independent. Failures in one do not propagate. Together they hold long sessions on contract.</text>

  <!-- Flow track -->
  <line x1="80" y1="360" x2="1200" y2="360" stroke="#30363d" stroke-width="2" stroke-dasharray="2 6"/>
  <!-- Moving pulse along the track -->
  <circle cx="80" cy="360" r="5" fill="#A78BFA">
    <animate attributeName="cx" values="80;1200;80" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;1;0" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- 5 Shields -->
  <!-- Shield 1: CHANGE_CONTRACT -->
  <g transform="translate(160,210)">
    <use href="#shield" width="140" height="168" fill="url(#shieldGrad)" stroke="#22C55E" stroke-width="2.5" filter="url(#soft)"/>
    <text x="70" y="42" text-anchor="middle" fill="#86EFAC" font-size="12" font-weight="800" letter-spacing="2">ANCHOR 1</text>
    <text x="70" y="74" text-anchor="middle" fill="#F0F6FC" font-size="16" font-weight="800">CHANGE</text>
    <text x="70" y="94" text-anchor="middle" fill="#F0F6FC" font-size="16" font-weight="800">CONTRACT</text>
    <text x="70" y="124" text-anchor="middle" fill="#bbf7d0" font-size="11.5">allowed_files</text>
    <text x="70" y="140" text-anchor="middle" fill="#bbf7d0" font-size="11.5">diff_budget</text>
    <text x="70" y="156" text-anchor="middle" fill="#bbf7d0" font-size="11.5">forbidden_types</text>
    <!-- node on track -->
    <circle cx="70" cy="150" r="0" />
  </g>
  <circle cx="230" cy="360" r="9" fill="#22C55E" stroke="#0d1117" stroke-width="3" filter="url(#glow)"/>

  <!-- Shield 2: SCOPE LOCK -->
  <g transform="translate(390,210)">
    <use href="#shield" width="140" height="168" fill="url(#shieldGrad)" stroke="#0EA5E9" stroke-width="2.5" filter="url(#soft)"/>
    <text x="70" y="42" text-anchor="middle" fill="#7DD3FC" font-size="12" font-weight="800" letter-spacing="2">ANCHOR 2</text>
    <text x="70" y="74" text-anchor="middle" fill="#F0F6FC" font-size="16" font-weight="800">SCOPE LOCK</text>
    <text x="70" y="94" text-anchor="middle" fill="#F0F6FC" font-size="16" font-weight="800">CHECK</text>
    <text x="70" y="124" text-anchor="middle" fill="#bae6fd" font-size="11.5">PreToolUse hook</text>
    <text x="70" y="140" text-anchor="middle" fill="#bae6fd" font-size="11.5">before every Write</text>
    <text x="70" y="156" text-anchor="middle" fill="#bae6fd" font-size="11.5">/ Edit / Bash</text>
  </g>
  <circle cx="460" cy="360" r="9" fill="#0EA5E9" stroke="#0d1117" stroke-width="3" filter="url(#glow)"/>

  <!-- Shield 3: ADVERSARIAL -->
  <g transform="translate(620,210)">
    <use href="#shield" width="140" height="168" fill="url(#shieldGrad)" stroke="#A78BFA" stroke-width="2.5" filter="url(#soft)"/>
    <text x="70" y="42" text-anchor="middle" fill="#C4B5FD" font-size="12" font-weight="800" letter-spacing="2">ANCHOR 3</text>
    <text x="70" y="74" text-anchor="middle" fill="#F0F6FC" font-size="16" font-weight="800">ADVERSARIAL</text>
    <text x="70" y="94" text-anchor="middle" fill="#F0F6FC" font-size="16" font-weight="800">REVIEW</text>
    <text x="70" y="124" text-anchor="middle" fill="#ddd6fe" font-size="11.5">3 parallel reviewers</text>
    <text x="70" y="140" text-anchor="middle" fill="#ddd6fe" font-size="11.5">zero context</text>
    <text x="70" y="156" text-anchor="middle" fill="#ddd6fe" font-size="11.5">per batch</text>
  </g>
  <circle cx="690" cy="360" r="9" fill="#A78BFA" stroke="#0d1117" stroke-width="3" filter="url(#glow)"/>

  <!-- Shield 4: GATES -->
  <g transform="translate(850,210)">
    <use href="#shield" width="140" height="168" fill="url(#shieldGrad)" stroke="#F59E0B" stroke-width="2.5" filter="url(#soft)"/>
    <text x="70" y="42" text-anchor="middle" fill="#FBBF24" font-size="12" font-weight="800" letter-spacing="2">ANCHOR 4</text>
    <text x="70" y="74" text-anchor="middle" fill="#F0F6FC" font-size="16" font-weight="800">GATE</text>
    <text x="70" y="94" text-anchor="middle" fill="#F0F6FC" font-size="16" font-weight="800">HIERARCHY</text>
    <text x="70" y="124" text-anchor="middle" fill="#fde68a" font-size="11.5">49 gates</text>
    <text x="70" y="140" text-anchor="middle" fill="#fde68a" font-size="11.5">5 hardness levels</text>
    <text x="70" y="156" text-anchor="middle" fill="#fde68a" font-size="11.5">deterministic deny</text>
  </g>
  <circle cx="920" cy="360" r="9" fill="#F59E0B" stroke="#0d1117" stroke-width="3" filter="url(#glow)"/>

  <!-- Shield 5: AUDIT TRAIL -->
  <g transform="translate(1080,210)">
    <use href="#shield" width="140" height="168" fill="url(#shieldGrad)" stroke="#EC4899" stroke-width="2.5" filter="url(#soft)"/>
    <text x="70" y="42" text-anchor="middle" fill="#F472B6" font-size="12" font-weight="800" letter-spacing="2">ANCHOR 5</text>
    <text x="70" y="74" text-anchor="middle" fill="#F0F6FC" font-size="16" font-weight="800">GLASS-BOX</text>
    <text x="70" y="94" text-anchor="middle" fill="#F0F6FC" font-size="16" font-weight="800">AUDIT TRAIL</text>
    <text x="70" y="124" text-anchor="middle" fill="#fbcfe8" font-size="11.5">TRACE.md + JSONL</text>
    <text x="70" y="140" text-anchor="middle" fill="#fbcfe8" font-size="11.5">HMAC-signed</text>
    <text x="70" y="156" text-anchor="middle" fill="#fbcfe8" font-size="11.5">+ Langfuse Cloud</text>
  </g>
  <circle cx="1150" cy="360" r="9" fill="#EC4899" stroke="#0d1117" stroke-width="3" filter="url(#glow)"/>

  <!-- Flow labels under track -->
  <g font-size="13" font-weight="700" fill="#8B949E" text-anchor="middle" letter-spacing="1">
    <text x="115" y="400">SPEC</text>
    <text x="345" y="400">PLAN</text>
    <text x="575" y="400">CODE</text>
    <text x="805" y="400">REVIEW</text>
    <text x="1035" y="400">VALIDATE</text>
    <text x="1190" y="400">SHIP</text>
  </g>

  <!-- Bottom: the confidence verdict -->
  <g transform="translate(640,520)">
    <rect x="-380" y="0" width="760" height="120" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5" filter="url(#soft)"/>
    <text x="0" y="34" text-anchor="middle" fill="#8B949E" font-size="13" font-weight="700" letter-spacing="2">EVERY RUN ENDS WITH A NUMBER</text>
    <g transform="translate(-250,72)">
      <rect x="-70" y="-22" width="140" height="44" rx="8" fill="#0c1a14" stroke="#22C55E" stroke-width="1.5"/>
      <text x="0" y="7" text-anchor="middle" font-size="16" font-weight="800" fill="#34D399">GO ≥ 0.80</text>
    </g>
    <g transform="translate(0,72)">
      <rect x="-90" y="-22" width="180" height="44" rx="8" fill="#231b06" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="0" y="7" text-anchor="middle" font-size="16" font-weight="800" fill="#FBBF24">CONDITIONAL ≥ 0.60</text>
    </g>
    <g transform="translate(250,72)">
      <rect x="-70" y="-22" width="140" height="44" rx="8" fill="#2a1018" stroke="#EF4444" stroke-width="1.5"/>
      <text x="0" y="7" text-anchor="middle" font-size="16" font-weight="800" fill="#F87171">NO-GO &lt; 0.60</text>
    </g>
  </g>

  <!-- Corner accents -->
  <g stroke="#7C3AED" stroke-width="2" fill="none" opacity="0.55">
    <path d="M 24 24 L 24 56 M 24 24 L 56 24"/>
    <path d="M 1256 24 L 1256 56 M 1256 24 L 1224 24"/>
    <path d="M 24 696 L 24 664 M 24 696 L 56 696"/>
    <path d="M 1256 696 L 1256 664 M 1256 696 L 1224 696"/>
  </g>
</svg>
