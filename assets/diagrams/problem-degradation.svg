<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%">
  <defs>
    <linearGradient id="pdBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="pdRisk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <linearGradient id="pdLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#F59E0B" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#EF4444" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7F1D1D" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="pdGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.25"/>
    </pattern>
    <filter id="pdGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="pdShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="560" fill="url(#pdBg)" rx="12"/>
  <rect width="1200" height="560" fill="url(#pdGrid)" rx="12"/>

  <!-- TITLE -->
  <text x="600" y="48" text-anchor="middle" fill="#f0f6fc" font-size="30" font-weight="700" letter-spacing="1.5" font-family="'Segoe UI',system-ui,sans-serif">THE LONG-SESSION DRIFT PROBLEM</text>
  <text x="600" y="78" text-anchor="middle" fill="#8b949e" font-size="15" font-family="'Segoe UI',system-ui,sans-serif">What happens to AI coding workflows when nothing anchors them</text>
  <line x1="380" y1="92" x2="820" y2="92" stroke="#7C3AED" stroke-width="2" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- AXES -->
  <!-- Y axis: risk level -->
  <text x="60" y="135" fill="#8b949e" font-size="11" font-family="'Segoe UI',system-ui,sans-serif" letter-spacing="0.5">DRIFT RISK</text>
  <line x1="100" y1="140" x2="100" y2="450" stroke="#30363d" stroke-width="1.5"/>
  <text x="92" y="155" fill="#7F1D1D" font-size="10" font-weight="600" text-anchor="end">CRITICAL</text>
  <text x="92" y="245" fill="#EF4444" font-size="10" font-weight="600" text-anchor="end">HIGH</text>
  <text x="92" y="335" fill="#F59E0B" font-size="10" font-weight="600" text-anchor="end">MEDIUM</text>
  <text x="92" y="425" fill="#22C55E" font-size="10" font-weight="600" text-anchor="end">CLEAN</text>

  <!-- Risk band background -->
  <rect x="100" y="140" width="1050" height="310" fill="url(#pdRisk)" opacity="0.07" rx="4"/>

  <!-- X axis: batch number -->
  <line x1="100" y1="450" x2="1150" y2="450" stroke="#30363d" stroke-width="1.5"/>
  <text x="625" y="500" text-anchor="middle" fill="#8b949e" font-size="11" letter-spacing="0.5" font-family="'Segoe UI',system-ui,sans-serif">SESSION TIME / BATCHES EXECUTED</text>

  <!-- X tick marks -->
  <g font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#8b949e">
    <line x1="180" y1="448" x2="180" y2="456" stroke="#30363d"/>
    <text x="180" y="472" text-anchor="middle">batch 1</text>
    <line x1="330" y1="448" x2="330" y2="456" stroke="#30363d"/>
    <text x="330" y="472" text-anchor="middle">batch 3</text>
    <line x1="480" y1="448" x2="480" y2="456" stroke="#30363d"/>
    <text x="480" y="472" text-anchor="middle">batch 5</text>
    <line x1="630" y1="448" x2="630" y2="456" stroke="#30363d"/>
    <text x="630" y="472" text-anchor="middle">batch 7</text>
    <line x1="780" y1="448" x2="780" y2="456" stroke="#30363d"/>
    <text x="780" y="472" text-anchor="middle">batch 9</text>
    <line x1="930" y1="448" x2="930" y2="456" stroke="#30363d"/>
    <text x="930" y="472" text-anchor="middle">batch 11</text>
    <line x1="1080" y1="448" x2="1080" y2="456" stroke="#30363d"/>
    <text x="1080" y="472" text-anchor="middle">batch 13</text>
  </g>

  <!-- DEGRADATION CURVE (path: risk rises non-linearly) -->
  <path d="M 180 420 Q 260 410 330 395 T 480 350 Q 560 320 630 270 T 780 200 Q 860 175 930 165 T 1080 155"
        stroke="url(#pdLine)"
        stroke-width="4"
        fill="none"
        filter="url(#pdGlow)">
    <animate attributeName="stroke-dasharray" values="0,2000;2000,0;2000,0" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- DATA POINTS + LABELS -->
  <!-- Batch 1: clean -->
  <g>
    <circle cx="180" cy="420" r="9" fill="#22C55E" filter="url(#pdShadow)">
      <animate attributeName="r" values="9;12;9" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="420" r="14" fill="none" stroke="#22C55E" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="14;22;14" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g font-family="'Segoe UI',system-ui,sans-serif">
    <rect x="135" y="365" width="160" height="42" rx="6" fill="#0d2818" stroke="#22C55E" stroke-width="1.2" filter="url(#pdShadow)"/>
    <text x="215" y="383" text-anchor="middle" fill="#86EFAC" font-size="11" font-weight="700" letter-spacing="0.5">EARLY SESSION</text>
    <text x="215" y="399" text-anchor="middle" fill="#bbf7d0" font-size="10">AI follows the spec</text>
  </g>

  <!-- Batch 5: scope creep starts -->
  <g>
    <circle cx="480" cy="350" r="9" fill="#F59E0B" filter="url(#pdShadow)"/>
    <circle cx="480" cy="350" r="14" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="14;22;14" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g font-family="'Segoe UI',system-ui,sans-serif">
    <rect x="380" y="190" width="200" height="58" rx="6" fill="#3a2a0e" stroke="#F59E0B" stroke-width="1.2" filter="url(#pdShadow)"/>
    <text x="480" y="208" text-anchor="middle" fill="#FCD34D" font-size="11" font-weight="700" letter-spacing="0.5">SCOPE CREEP STARTS</text>
    <text x="480" y="224" text-anchor="middle" fill="#fde68a" font-size="10">"Let me also refactor</text>
    <text x="480" y="237" text-anchor="middle" fill="#fde68a" font-size="10">this related function..."</text>
    <line x1="480" y1="248" x2="480" y2="345" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2,3" opacity="0.5"/>
  </g>

  <!-- Batch 9: drift -->
  <g>
    <circle cx="780" cy="200" r="9" fill="#EF4444" filter="url(#pdShadow)"/>
    <circle cx="780" cy="200" r="14" fill="none" stroke="#EF4444" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="14;22;14" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g font-family="'Segoe UI',system-ui,sans-serif">
    <rect x="680" y="115" width="200" height="58" rx="6" fill="#3b0a0a" stroke="#EF4444" stroke-width="1.2" filter="url(#pdShadow)"/>
    <text x="780" y="133" text-anchor="middle" fill="#FCA5A5" font-size="11" font-weight="700" letter-spacing="0.5">UNAUTHORIZED CHANGES</text>
    <text x="780" y="149" text-anchor="middle" fill="#fecaca" font-size="10">new dependency added,</text>
    <text x="780" y="162" text-anchor="middle" fill="#fecaca" font-size="10">tests weakened to pass</text>
    <line x1="780" y1="173" x2="780" y2="195" stroke="#EF4444" stroke-width="1" stroke-dasharray="2,3" opacity="0.5"/>
  </g>

  <!-- Batch 13: catastrophe -->
  <g>
    <circle cx="1080" cy="155" r="11" fill="#7F1D1D" filter="url(#pdShadow)">
      <animate attributeName="r" values="11;14;11" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="155" r="17" fill="none" stroke="#EF4444" stroke-width="1.5" opacity="0.5">
      <animate attributeName="r" values="17;30;17" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="1080" y="160" text-anchor="middle" fill="#FCA5A5" font-size="13" font-weight="700">!</text>
  </g>
  <g font-family="'Segoe UI',system-ui,sans-serif">
    <rect x="950" y="270" width="200" height="58" rx="6" fill="#2d0a0a" stroke="#7F1D1D" stroke-width="1.5" filter="url(#pdShadow)"/>
    <text x="1050" y="288" text-anchor="middle" fill="#FCA5A5" font-size="11" font-weight="700" letter-spacing="0.5">CONTRACT BROKEN</text>
    <text x="1050" y="304" text-anchor="middle" fill="#fecaca" font-size="10">code no longer matches</text>
    <text x="1050" y="317" text-anchor="middle" fill="#fecaca" font-size="10">the original requirements</text>
    <line x1="1075" y1="270" x2="1080" y2="170" stroke="#7F1D1D" stroke-width="1" stroke-dasharray="2,3" opacity="0.6"/>
  </g>

  <!-- BOTTOM CAPTION -->
  <g font-family="'Segoe UI',system-ui,sans-serif">
    <rect x="100" y="525" width="1050" height="0" fill="none"/>
    <text x="600" y="548" text-anchor="middle" fill="#8b949e" font-size="13" font-style="italic" letter-spacing="0.3">Traditional CI/CD catches syntax errors. It does not catch architectural drift, weakened tests, or scope creep in batch 7.</text>
  </g>
</svg>
