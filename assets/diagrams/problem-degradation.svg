<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%">
  <defs>
    <linearGradient id="pdBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="pdRisk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <linearGradient id="pdLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#F59E0B" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#EF4444" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#7F1D1D" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="pdGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.6" opacity="0.3"/>
    </pattern>
    <filter id="pdGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="pdShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#pdBg)" rx="14"/>
  <rect width="1200" height="700" fill="url(#pdGrid)" rx="14"/>

  <!-- TITLE -->
  <text x="600" y="70" text-anchor="middle" fill="#f0f6fc" font-size="44" font-weight="800" letter-spacing="1.5" font-family="'Segoe UI',system-ui,sans-serif">The Long-Session Drift Problem</text>
  <text x="600" y="108" text-anchor="middle" fill="#8b949e" font-size="22" font-family="'Segoe UI',system-ui,sans-serif">What happens to AI coding workflows when nothing anchors them</text>
  <line x1="320" y1="128" x2="880" y2="128" stroke="#7C3AED" stroke-width="3" opacity="0.55">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Y AXIS LABEL -->
  <text x="60" y="180" fill="#8b949e" font-size="17" font-weight="700" letter-spacing="1" font-family="'Segoe UI',system-ui,sans-serif">DRIFT RISK</text>
  <line x1="100" y1="200" x2="100" y2="560" stroke="#30363d" stroke-width="2"/>
  <text x="92" y="215" fill="#7F1D1D" font-size="16" font-weight="700" text-anchor="end" font-family="'Segoe UI',system-ui,sans-serif">CRITICAL</text>
  <text x="92" y="325" fill="#EF4444" font-size="16" font-weight="700" text-anchor="end" font-family="'Segoe UI',system-ui,sans-serif">HIGH</text>
  <text x="92" y="435" fill="#F59E0B" font-size="16" font-weight="700" text-anchor="end" font-family="'Segoe UI',system-ui,sans-serif">MEDIUM</text>
  <text x="92" y="545" fill="#22C55E" font-size="16" font-weight="700" text-anchor="end" font-family="'Segoe UI',system-ui,sans-serif">CLEAN</text>

  <!-- Risk band background -->
  <rect x="100" y="200" width="1050" height="360" fill="url(#pdRisk)" opacity="0.08" rx="6"/>

  <!-- X axis -->
  <line x1="100" y1="560" x2="1150" y2="560" stroke="#30363d" stroke-width="2"/>
  <text x="625" y="640" text-anchor="middle" fill="#8b949e" font-size="17" letter-spacing="1" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">SESSION TIME / BATCHES EXECUTED</text>

  <!-- X tick marks -->
  <g font-family="'Segoe UI',system-ui,sans-serif" font-size="15" fill="#8b949e">
    <line x1="180" y1="558" x2="180" y2="568" stroke="#30363d" stroke-width="2"/>
    <text x="180" y="590" text-anchor="middle" font-weight="600">batch 1</text>
    <line x1="330" y1="558" x2="330" y2="568" stroke="#30363d" stroke-width="2"/>
    <text x="330" y="590" text-anchor="middle" font-weight="600">batch 3</text>
    <line x1="480" y1="558" x2="480" y2="568" stroke="#30363d" stroke-width="2"/>
    <text x="480" y="590" text-anchor="middle" font-weight="600">batch 5</text>
    <line x1="630" y1="558" x2="630" y2="568" stroke="#30363d" stroke-width="2"/>
    <text x="630" y="590" text-anchor="middle" font-weight="600">batch 7</text>
    <line x1="780" y1="558" x2="780" y2="568" stroke="#30363d" stroke-width="2"/>
    <text x="780" y="590" text-anchor="middle" font-weight="600">batch 9</text>
    <line x1="930" y1="558" x2="930" y2="568" stroke="#30363d" stroke-width="2"/>
    <text x="930" y="590" text-anchor="middle" font-weight="600">batch 11</text>
    <line x1="1080" y1="558" x2="1080" y2="568" stroke="#30363d" stroke-width="2"/>
    <text x="1080" y="590" text-anchor="middle" font-weight="600">batch 13</text>
  </g>

  <!-- DEGRADATION CURVE -->
  <path d="M 180 525 Q 260 510 330 490 T 480 430 Q 560 390 630 320 T 780 240 Q 860 215 930 200 T 1080 190"
        stroke="url(#pdLine)"
        stroke-width="6"
        fill="none"
        filter="url(#pdGlow)">
    <animate attributeName="stroke-dasharray" values="0,2000;2000,0;2000,0" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- DATA POINT — Batch 1: clean -->
  <g>
    <circle cx="180" cy="525" r="13" fill="#22C55E" filter="url(#pdShadow)">
      <animate attributeName="r" values="13;17;13" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="525" r="20" fill="none" stroke="#22C55E" stroke-width="1.5" opacity="0.4">
      <animate attributeName="r" values="20;32;20" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g font-family="'Segoe UI',system-ui,sans-serif">
    <rect x="120" y="450" width="200" height="62" rx="8" fill="#0d2818" stroke="#22C55E" stroke-width="2" filter="url(#pdShadow)"/>
    <text x="220" y="476" text-anchor="middle" fill="#86EFAC" font-size="16" font-weight="800" letter-spacing="0.8">EARLY SESSION</text>
    <text x="220" y="500" text-anchor="middle" fill="#bbf7d0" font-size="15">AI follows the spec</text>
  </g>

  <!-- DATA POINT — Batch 5: scope creep -->
  <g>
    <circle cx="480" cy="430" r="13" fill="#F59E0B" filter="url(#pdShadow)"/>
    <circle cx="480" cy="430" r="20" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.4">
      <animate attributeName="r" values="20;32;20" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g font-family="'Segoe UI',system-ui,sans-serif">
    <rect x="360" y="240" width="240" height="78" rx="8" fill="#3a2a0e" stroke="#F59E0B" stroke-width="2" filter="url(#pdShadow)"/>
    <text x="480" y="266" text-anchor="middle" fill="#FCD34D" font-size="16" font-weight="800" letter-spacing="0.8">SCOPE CREEP STARTS</text>
    <text x="480" y="290" text-anchor="middle" fill="#fde68a" font-size="14">"Let me also refactor</text>
    <text x="480" y="308" text-anchor="middle" fill="#fde68a" font-size="14">this related function..."</text>
    <line x1="480" y1="318" x2="480" y2="423" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,4" opacity="0.55"/>
  </g>

  <!-- DATA POINT — Batch 9: unauthorized -->
  <g>
    <circle cx="780" cy="240" r="13" fill="#EF4444" filter="url(#pdShadow)"/>
    <circle cx="780" cy="240" r="20" fill="none" stroke="#EF4444" stroke-width="1.5" opacity="0.4">
      <animate attributeName="r" values="20;32;20" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g font-family="'Segoe UI',system-ui,sans-serif">
    <rect x="660" y="138" width="240" height="78" rx="8" fill="#3b0a0a" stroke="#EF4444" stroke-width="2" filter="url(#pdShadow)"/>
    <text x="780" y="164" text-anchor="middle" fill="#FCA5A5" font-size="16" font-weight="800" letter-spacing="0.8">UNAUTHORIZED CHANGES</text>
    <text x="780" y="188" text-anchor="middle" fill="#fecaca" font-size="14">new dependency added,</text>
    <text x="780" y="206" text-anchor="middle" fill="#fecaca" font-size="14">tests weakened to pass</text>
    <line x1="780" y1="216" x2="780" y2="233" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3,4" opacity="0.55"/>
  </g>

  <!-- DATA POINT — Batch 13: catastrophe -->
  <g>
    <circle cx="1080" cy="190" r="15" fill="#7F1D1D" filter="url(#pdShadow)">
      <animate attributeName="r" values="15;19;15" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="190" r="24" fill="none" stroke="#EF4444" stroke-width="2" opacity="0.5">
      <animate attributeName="r" values="24;42;24" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="1080" y="197" text-anchor="middle" fill="#FCA5A5" font-size="20" font-weight="900" font-family="'Segoe UI',system-ui,sans-serif">!</text>
  </g>
  <g font-family="'Segoe UI',system-ui,sans-serif">
    <rect x="940" y="330" width="240" height="78" rx="8" fill="#2d0a0a" stroke="#7F1D1D" stroke-width="2.5" filter="url(#pdShadow)"/>
    <text x="1060" y="356" text-anchor="middle" fill="#FCA5A5" font-size="16" font-weight="800" letter-spacing="0.8">CONTRACT BROKEN</text>
    <text x="1060" y="380" text-anchor="middle" fill="#fecaca" font-size="14">code no longer matches</text>
    <text x="1060" y="398" text-anchor="middle" fill="#fecaca" font-size="14">the original requirements</text>
    <line x1="1075" y1="330" x2="1080" y2="205" stroke="#7F1D1D" stroke-width="1.5" stroke-dasharray="3,4" opacity="0.6"/>
  </g>

  <!-- BOTTOM CAPTION -->
  <text x="600" y="678" text-anchor="middle" fill="#a8b3c7" font-size="17" font-style="italic" letter-spacing="0.3" font-family="'Segoe UI',system-ui,sans-serif">Traditional CI/CD catches syntax errors. It does not catch architectural drift, weakened tests, or scope creep in batch 7.</text>
</svg>
