<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="100%" font-family="'Segoe UI', Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.22"/>
    </pattern>
    <linearGradient id="zoneClean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="zoneCreep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="zoneDrift" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="zoneBroken" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="poLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="580" fill="url(#bg)" rx="14"/>
  <rect width="1200" height="580" fill="url(#grid)" rx="14"/>

  <text x="600" y="56" text-anchor="middle" fill="#F0F6FC" font-size="34" font-weight="800" letter-spacing="0.5">The Long-Session Drift Curve</text>
  <text x="600" y="88" text-anchor="middle" fill="#8B949E" font-size="17">Without governance, AI coding sessions degrade on a predictable curve. CI catches none of it.</text>

  <!-- Phase bands -->
  <g opacity="0.95">
    <rect x="90"  y="130" width="240" height="340" fill="url(#zoneClean)"/>
    <rect x="330" y="130" width="260" height="340" fill="url(#zoneCreep)"/>
    <rect x="590" y="130" width="260" height="340" fill="url(#zoneDrift)"/>
    <rect x="850" y="130" width="280" height="340" fill="url(#zoneBroken)"/>
  </g>
  <g stroke="#30363d" stroke-width="1" opacity="0.5" stroke-dasharray="4 4">
    <line x1="330" y1="130" x2="330" y2="470"/>
    <line x1="590" y1="130" x2="590" y2="470"/>
    <line x1="850" y1="130" x2="850" y2="470"/>
  </g>

  <g stroke="#484f58" stroke-width="1.5">
    <line x1="90" y1="470" x2="1130" y2="470"/>
    <line x1="90" y1="130" x2="90" y2="470"/>
  </g>
  <g fill="#8B949E" font-size="12" text-anchor="end">
    <text x="82" y="134">100%</text>
    <text x="82" y="304">50%</text>
    <text x="82" y="474">0%</text>
  </g>
  <text x="46" y="300" fill="#8B949E" font-size="13" font-weight="600" transform="rotate(-90 46 300)" text-anchor="middle">Spec adherence</text>

  <g fill="#8B949E" font-size="12" text-anchor="middle">
    <text x="90"   y="490">B1</text>
    <text x="170"  y="490">B2</text>
    <text x="250"  y="490">B3</text>
    <text x="370"  y="490">B4</text>
    <text x="460"  y="490">B5-6</text>
    <text x="550"  y="490">B7</text>
    <text x="650"  y="490">B8</text>
    <text x="740"  y="490">B9-10</text>
    <text x="830"  y="490">B11</text>
    <text x="930"  y="490">B12</text>
    <text x="1080" y="490">B14+</text>
  </g>

  <path d="M 90 150 C 170 152, 250 162, 330 185 C 410 210, 480 240, 590 290 C 690 335, 780 375, 850 405 C 940 435, 1020 450, 1130 458"
        fill="none" stroke="#EF4444" stroke-width="3.5" filter="url(#glow)" stroke-linecap="round" stroke-dasharray="1400" stroke-dashoffset="1400">
    <animate attributeName="stroke-dashoffset" values="1400;0" dur="2.4s" begin="0.3s" fill="freeze"/>
  </path>

  <path d="M 90 146 L 1130 158" fill="none" stroke="url(#poLine)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="2.2s" fill="freeze"/>
  </path>

  <g fill="#EF4444" stroke="#0d1117" stroke-width="2">
    <circle cx="90"   cy="150" r="5"/>
    <circle cx="330"  cy="185" r="5"/>
    <circle cx="590"  cy="290" r="5"/>
    <circle cx="850"  cy="405" r="5"/>
    <circle cx="1130" cy="458" r="6"/>
  </g>

  <g>
    <circle cx="1130" cy="158" r="6" fill="#A78BFA" stroke="#0d1117" stroke-width="2"/>
    <circle cx="1130" cy="158" r="11" fill="none" stroke="#A78BFA" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="11;18;11" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-size="13" font-weight="800" letter-spacing="1.5" text-anchor="middle">
    <text x="210" y="118" fill="#34D399">CLEAN · B1-3</text>
    <text x="460" y="118" fill="#FBBF24">SCOPE CREEP · B4-7</text>
    <text x="720" y="118" fill="#FB923C">DRIFT · B8-11</text>
    <text x="990" y="118" fill="#F87171">CONTRACT BROKEN · B12+</text>
  </g>

  <g font-size="12.5" fill="#C9D1D9">
    <text x="210" y="200" text-anchor="middle" font-style="italic" opacity="0.9">spec followed · tests pass</text>
    <text x="460" y="255" text-anchor="middle" font-style="italic" opacity="0.9">"let me also refactor this…"</text>
    <text x="720" y="360" text-anchor="middle" font-style="italic" opacity="0.9">new deps · weakened tests</text>
    <text x="990" y="430" text-anchor="middle" font-style="italic" opacity="0.9">CI green, problem unsolved</text>
  </g>

  <g transform="translate(95,520)">
    <rect x="0" y="0" width="1010" height="40" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <g transform="translate(40,20)">
      <line x1="0" y1="0" x2="34" y2="0" stroke="#EF4444" stroke-width="3.5"/>
      <text x="44" y="5" fill="#C9D1D9" font-size="13.5" font-weight="600">Ungoverned AI session</text>
    </g>
    <g transform="translate(310,20)">
      <line x1="0" y1="0" x2="34" y2="0" stroke="url(#poLine)" stroke-width="3.5"/>
      <text x="44" y="5" fill="#C9D1D9" font-size="13.5" font-weight="600">Pipeline Orchestrator (CHANGE_CONTRACT + adversarial review + 49 gates)</text>
    </g>
  </g>

  <g stroke="#7C3AED" stroke-width="2" fill="none" opacity="0.55">
    <path d="M 24 24 L 24 56 M 24 24 L 56 24"/>
    <path d="M 1176 24 L 1176 56 M 1176 24 L 1144 24"/>
  </g>
</svg>
