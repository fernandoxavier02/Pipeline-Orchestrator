<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="100%">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="phaseGrad0" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="phaseGrad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="phaseGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="phaseGrad3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect width="1200" height="1000" fill="url(#bg4)" rx="12"/>

  <text x="600" y="50" text-anchor="middle" fill="#f0f6fc" font-size="48" font-weight="700" letter-spacing="2" font-family="'Segoe UI',system-ui,sans-serif">EXECUTION FLOW — 4 PHASES</text>
  <line x1="300" y1="68" x2="900" y2="68" stroke="#7C3AED" stroke-width="2" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- PHASE 0 -->
  <g>
    <rect x="40" y="95" width="1120" height="195" rx="12" fill="#1e1b4b" stroke="url(#phaseGrad0)" stroke-width="2.5" filter="url(#shadow)" opacity="0.9">
      <animate attributeName="stroke-width" values="2.5;4;2.5" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="70" y="130" fill="#7C3AED" font-size="32" font-weight="800" letter-spacing="2" font-family="'Segoe UI',system-ui,sans-serif">PHASE 0 — TRIAGE &amp; CONFIRM</text>
    <text x="500" y="130" fill="#6d28d9" font-size="20" font-family="'Segoe UI',system-ui,sans-serif">Classify → Detect gaps → User approval</text>

    <rect x="70" y="150" width="240" height="120" rx="10" fill="#2d2150" stroke="#8b5cf6" stroke-width="1.5">
      <animate attributeName="stroke-width" values="1.5;2.5;1.5" dur="3s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <text x="190" y="185" text-anchor="middle" fill="#c4b5fd" font-size="24" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">Task Classifier</text>
    <text x="190" y="215" text-anchor="middle" fill="#7c3aed" font-size="20" font-family="'Segoe UI',system-ui,sans-serif">type + complexity + flags</text>
    <text x="190" y="245" text-anchor="middle" fill="#a78bfa" font-size="20" font-family="'Segoe UI',system-ui,sans-serif">SIMPLES / MEDIA / COMPLEXA</text>

    <rect x="340" y="150" width="240" height="120" rx="10" fill="#2d2150" stroke="#8b5cf6" stroke-width="1.5">
      <animate attributeName="stroke-width" values="1.5;2.5;1.5" dur="3s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <text x="460" y="185" text-anchor="middle" fill="#c4b5fd" font-size="24" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">Information Gate</text>
    <text x="460" y="215" text-anchor="middle" fill="#7c3aed" font-size="20" font-family="'Segoe UI',system-ui,sans-serif">AskUserQuestion blocks</text>
    <text x="460" y="245" text-anchor="middle" fill="#a78bfa" font-size="20" font-family="'Segoe UI',system-ui,sans-serif">until critical gaps closed</text>

    <rect x="610" y="150" width="240" height="120" rx="10" fill="#2d2150" stroke="#8b5cf6" stroke-width="1.5">
      <animate attributeName="stroke-width" values="1.5;2.5;1.5" dur="3s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <text x="730" y="185" text-anchor="middle" fill="#c4b5fd" font-size="24" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">Design Interrogator</text>
    <text x="730" y="215" text-anchor="middle" fill="#7c3aed" font-size="20" font-family="'Segoe UI',system-ui,sans-serif">Trade-off resolution for</text>
    <text x="730" y="245" text-anchor="middle" fill="#a78bfa" font-size="20" font-family="'Segoe UI',system-ui,sans-serif">COMPLEXA tasks</text>

    <rect x="880" y="150" width="260" height="120" rx="10" fill="#1e1b4b" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3">
      <animate attributeName="stroke-dashoffset" values="0;-8" dur="1s" repeatCount="indefinite"/>
    </rect>
    <text x="1010" y="190" text-anchor="middle" fill="#fde68a" font-size="24" font-weight="800" font-family="'Segoe UI',system-ui,sans-serif">Pipeline Proposal</text>
    <text x="1010" y="225" text-anchor="middle" fill="#f59e0b" font-size="20" font-family="'Segoe UI',system-ui,sans-serif">User confirms or overrides</text>
    <text x="1010" y="255" text-anchor="middle" fill="#fde68a" font-size="18" font-weight="600" font-family="'Segoe UI',system-ui,sans-serif">GO / MODIFY / ABORT</text>
  </g>

  <line x1="600" y1="290" x2="600" y2="320" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow)" opacity="0.6">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/>
  </line>

  <!-- PHASE 1 -->
  <g>
    <rect x="40" y="325" width="1120" height="170" rx="12" fill="#052e16" stroke="url(#phaseGrad1)" stroke-width="2.5" filter="url(#shadow)" opacity="0.9">
      <animate attributeName="stroke-width" values="2.5;4;2.5" dur="4s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <text x="70" y="360" fill="#22C55E" font-size="32" font-weight="800" letter-spacing="2" font-family="'Segoe UI',system-ui,sans-serif">PHASE 1 — PLAN &amp; PREPARE</text>
    <text x="520" y="360" fill="#16a34a" font-size="20" font-family="'Segoe UI',system-ui,sans-serif">Plan Architect + Quality Gate Router</text>

    <rect x="70" y="380" width="340" height="95" rx="10" fill="#14532d" stroke="#22C55E" stroke-width="1.5">
      <animate attributeName="stroke-width" values="1.5;2.5;1.5" dur="3s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <text x="240" y="415" text-anchor="middle" fill="#86efac" font-size="24" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">Plan Architect</text>
    <text x="240" y="445" text-anchor="middle" fill="#22c55e" font-size="20" font-family="'Segoe UI',system-ui,sans-serif">Implementation plan + file mapping</text>
    <text x="240" y="470" text-anchor="middle" fill="#4ade80" font-size="18" font-family="'Segoe UI',system-ui,sans-serif">Auto for COMPLEXA, opt-in for MEDIA</text>

    <rect x="440" y="380" width="340" height="95" rx="10" fill="#14532d" stroke="#22C55E" stroke-width="1.5">
      <animate attributeName="stroke-width" values="1.5;2.5;1.5" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="610" y="415" text-anchor="middle" fill="#86efac" font-size="24" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">Quality Gate Router</text>
    <text x="610" y="445" text-anchor="middle" fill="#22c55e" font-size="20" font-family="'Segoe UI',system-ui,sans-serif">TDD scenario generation</text>
    <text x="610" y="470" text-anchor="middle" fill="#4ade80" font-size="18" font-family="'Segoe UI',system-ui,sans-serif">User approves tests BEFORE code</text>

    <rect x="810" y="380" width="330" height="95" rx="10" fill="#1e1b4b" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3">
      <animate attributeName="stroke-dashoffset" values="0;-8" dur="1s" repeatCount="indefinite"/>
    </rect>
    <text x="975" y="420" text-anchor="middle" fill="#fde68a" font-size="22" font-weight="800" font-family="'Segoe UI',system-ui,sans-serif">MEDIA/COMPLEXA</text>
    <text x="975" y="450" text-anchor="middle" fill="#f59e0b" font-size="20" font-family="'Segoe UI',system-ui,sans-serif">Plan + TDD scenarios required</text>
  </g>

  <line x1="600" y1="495" x2="600" y2="525" stroke="#22C55E" stroke-width="2" marker-end="url(#arrow)" opacity="0.6">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </line>

  <!-- PHASE 2 -->
  <g>
    <rect x="40" y="530" width="1120" height="210" rx="12" fill="#451a03" stroke="url(#phaseGrad2)" stroke-width="2.5" filter="url(#shadow)" opacity="0.9">
      <animate attributeName="stroke-width" values="2.5;4;2.5" dur="4s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <text x="70" y="565" fill="#f59e0b" font-size="32" font-weight="800" letter-spacing="2" font-family="'Segoe UI',system-ui,sans-serif">PHASE 2 — EXECUTE &amp; REVIEW</text>
    <text x="560" y="565" fill="#d97706" font-size="20" font-family="'Segoe UI',system-ui,sans-serif">Batches → Adversarial Review → Fix Loop</text>

    <rect x="70" y="585" width="220" height="135" rx="10" fill="#422006" stroke="#f59e0b" stroke-width="1.5">
      <animate attributeName="stroke-width" values="1.5;2.5;1.5" dur="3s" begin="2.2s" repeatCount="indefinite"/>
    </rect>
    <text x="180" y="620" text-anchor="middle" fill="#fde68a" font-size="24" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">Batch Loop</text>
    <text x="180" y="655" text-anchor="middle" fill="#f59e0b" font-size="20" font-family="'Segoe UI',system-ui,sans-serif">1-3 tasks per batch</text>
    <text x="180" y="685" text-anchor="middle" fill="#fcd34d" font-size="18" font-family="'Segoe UI',system-ui,sans-serif">Complexity-adaptive sizing</text>

    <rect x="320" y="585" width="220" height="135" rx="10" fill="#422006" stroke="#f59e0b" stroke-width="1.5">
      <animate attributeName="stroke-width" values="1.5;2.5;1.5" dur="3s" begin="2.5s" repeatCount="indefinite"/>
    </rect>
    <text x="430" y="620" text-anchor="middle" fill="#fde68a" font-size="24" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">Adversarial Review</text>
    <text x="430" y="655" text-anchor="middle" fill="#f59e0b" font-size="20" font-family="'Segoe UI',system-ui,sans-serif">Per-batch security scan</text>
    <text x="430" y="685" text-anchor="middle" fill="#fcd34d" font-size="18" font-family="'Segoe UI',system-ui,sans-serif">Zero context shared</text>

    <rect x="570" y="585" width="220" height="135" rx="10" fill="#7f1d1d" stroke="#EF4444" stroke-width="1.5">
      <animate attributeName="stroke-width" values="1.5;2.5;1.5" dur="3s" begin="2.8s" repeatCount="indefinite"/>
    </rect>
    <text x="680" y="620" text-anchor="middle" fill="#fca5a5" font-size="24" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">Fix Loop</text>
    <text x="680" y="655" text-anchor="middle" fill="#ef4444" font-size="20" font-family="'Segoe UI',system-ui,sans-serif">Max 3 attempts per batch</text>
    <text x="680" y="685" text-anchor="middle" fill="#f87171" font-size="18" font-family="'Segoe UI',system-ui,sans-serif">Stop rule: 2 failures = halt</text>

    <rect x="820" y="585" width="320" height="135" rx="10" fill="#1e1b4b" stroke="#ec4899" stroke-width="2" stroke-dasharray="5,3">
      <animate attributeName="stroke-dashoffset" values="0;-8" dur="1s" repeatCount="indefinite"/>
    </rect>
    <text x="980" y="620" text-anchor="middle" fill="#f9a8d4" font-size="24" font-weight="800" font-family="'Segoe UI',system-ui,sans-serif">Final Adversarial Team</text>
    <text x="980" y="655" text-anchor="middle" fill="#ec4899" font-size="20" font-family="'Segoe UI',system-ui,sans-serif">3 scanners ‖ parallel, zero context</text>
    <text x="980" y="685" text-anchor="middle" fill="#f472b6" font-size="18" font-family="'Segoe UI',system-ui,sans-serif">Security + Architecture + Quality</text>
  </g>

  <line x1="600" y1="740" x2="600" y2="770" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow)" opacity="0.6">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" begin="1s" repeatCount="indefinite"/>
  </line>

  <!-- PHASE 3 -->
  <g>
    <rect x="40" y="775" width="1120" height="165" rx="12" fill="#1e1b4b" stroke="url(#phaseGrad3)" stroke-width="2.5" filter="url(#shadow)" opacity="0.9">
      <animate attributeName="stroke-width" values="2.5;4;2.5" dur="4s" begin="3s" repeatCount="indefinite"/>
    </rect>
    <text x="70" y="810" fill="#ec4899" font-size="32" font-weight="800" letter-spacing="2" font-family="'Segoe UI',system-ui,sans-serif">PHASE 3 — VALIDATE &amp; CLOSE</text>
    <text x="540" y="810" fill="#be185d" font-size="20" font-family="'Segoe UI',system-ui,sans-serif">Sanity Check → Final Validator → TRACE.md</text>

    <rect x="70" y="830" width="280" height="90" rx="10" fill="#2d2150" stroke="#ec4899" stroke-width="1.5">
      <animate attributeName="stroke-width" values="1.5;2.5;1.5" dur="3s" begin="3.2s" repeatCount="indefinite"/>
    </rect>
    <text x="210" y="865" text-anchor="middle" fill="#f9a8d4" font-size="24" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">Sanity Checker</text>
    <text x="210" y="895" text-anchor="middle" fill="#ec4899" font-size="20" font-family="'Segoe UI',system-ui,sans-serif">Build + tests + regression</text>

    <rect x="380" y="830" width="280" height="90" rx="10" fill="#2d2150" stroke="#ec4899" stroke-width="1.5">
      <animate attributeName="stroke-width" values="1.5;2.5;1.5" dur="3s" begin="3.5s" repeatCount="indefinite"/>
    </rect>
    <text x="520" y="865" text-anchor="middle" fill="#f9a8d4" font-size="24" font-weight="700" font-family="'Segoe UI',system-ui,sans-serif">Final Validator</text>
    <text x="520" y="895" text-anchor="middle" fill="#ec4899" font-size="20" font-family="'Segoe UI',system-ui,sans-serif">Go / No-Go decision + score</text>

    <rect x="690" y="830" width="450" height="90" rx="10" fill="#1a1a2e" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5,3">
      <animate attributeName="stroke-dashoffset" values="0;-8" dur="1s" repeatCount="indefinite"/>
    </rect>
    <text x="915" y="865" text-anchor="middle" fill="#c4b5fd" font-size="24" font-weight="800" font-family="'Segoe UI',system-ui,sans-serif">TRACE.md Audit Trail</text>
    <text x="915" y="895" text-anchor="middle" fill="#8b5cf6" font-size="20" font-family="'Segoe UI',system-ui,sans-serif">Complete execution log emitted to .pipeline-orchestrator/runs/</text>
  </g>

  <line x1="50" y1="960" x2="1150" y2="960" stroke="#7C3AED" stroke-width="1" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
  </line>
  <text x="600" y="985" text-anchor="middle" fill="#8b949e" font-size="18" font-weight="600" font-family="'Segoe UI',system-ui,sans-serif">Every phase transition is validated by the Sentinel — no agent spawns out of sequence</text>
</svg>