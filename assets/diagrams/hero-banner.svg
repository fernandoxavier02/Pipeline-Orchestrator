<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%">
  <defs>
    <radialGradient id="orb1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#EC4899;#7C3AED" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9">
        <animate attributeName="stop-color" values="#0EA5E9;#22C55E;#0EA5E9" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb3" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3">
        <animate attributeName="stop-opacity" values="0.3;0.6;0.3" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="-50%" stop-color="#7C3AED"/>
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#7C3AED"/>
      <animate attributeName="x1" values="-100%;100%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="900" height="360" fill="#0d1117"/>
  <rect width="900" height="360" fill="url(#grid)"/>
  <rect width="900" height="360" fill="url(#orb1)"/>
  <rect width="900" height="360" fill="url(#orb2)"/>
  <rect width="900" height="360" fill="url(#orb3)"/>

  <g opacity="0.4">
    <circle cx="80" cy="70" r="2" fill="#7C3AED">
      <animate attributeName="cy" values="70;55;70" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="160" r="1.5" fill="#0EA5E9">
      <animate attributeName="cy" values="160;140;160" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="90" r="2.5" fill="#EC4899">
      <animate attributeName="cy" values="90;75;90" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="220" r="1.5" fill="#22C55E">
      <animate attributeName="cy" values="220;200;220" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="120" r="2" fill="#F59E0B">
      <animate attributeName="cy" values="120;105;120" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="250" r="1.5" fill="#7C3AED">
      <animate attributeName="cy" values="250;230;250" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(450, 180)" opacity="0.1">
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="none" stroke="#7C3AED" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="0,-45 39,-22.5 39,22.5 0,45 -39,22.5 -39,-22.5" fill="none" stroke="#0EA5E9" stroke-width="0.5">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="45s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <text x="450" y="145" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="52" font-weight="800" fill="url(#shimmer)" letter-spacing="2">PIPELINE ORCHESTRATOR</text>

  <g transform="translate(450, 170)">
    <rect x="-65" y="0" width="130" height="32" rx="16" fill="#7C3AED" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="22" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="16" font-weight="700" fill="#fff">v7.1.0</text>
  </g>

  <text x="450" y="232" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="22" fill="#8b949e" font-weight="400" letter-spacing="1">
    The governance layer between your spec and production
  </text>

  <g transform="translate(0, 270)">
    <text x="170" y="0" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="32" font-weight="800" fill="#c4b5fd">
      20
      <animate attributeName="fill" values="#c4b5fd;#fff;#c4b5fd" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="170" y="26" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="15" fill="#8b949e" font-weight="500">AGENTS</text>

    <text x="370" y="0" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="32" font-weight="800" fill="#7dd3fc">
      32
      <animate attributeName="fill" values="#7dd3fc;#fff;#7dd3fc" dur="4s" begin="1s" repeatCount="indefinite"/>
    </text>
    <text x="370" y="26" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="15" fill="#8b949e" font-weight="500">GATES</text>

    <text x="550" y="0" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="32" font-weight="800" fill="#86efac">
      31
      <animate attributeName="fill" values="#86efac;#fff;#86efac" dur="4s" begin="2s" repeatCount="indefinite"/>
    </text>
    <text x="550" y="26" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="15" fill="#8b949e" font-weight="500">TEST SUITES</text>

    <text x="730" y="0" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="32" font-weight="800" fill="#fde68a">
      0
      <animate attributeName="fill" values="#fde68a;#fff;#fde68a" dur="4s" begin="3s" repeatCount="indefinite"/>
    </text>
    <text x="730" y="26" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="15" fill="#8b949e" font-weight="500">DEPENDENCIES</text>
  </g>

  <line x1="130" y1="330" x2="770" y2="330" stroke="#7C3AED" stroke-width="1" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
  </line>

  <g opacity="0.3">
    <path d="M 24 24 L 24 48 M 24 24 L 48 24" stroke="#7C3AED" stroke-width="2" fill="none">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 876 24 L 876 48 M 876 24 L 852 24" stroke="#7C3AED" stroke-width="2" fill="none">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" begin="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 24 336 L 24 312 M 24 336 L 48 336" stroke="#7C3AED" stroke-width="2" fill="none">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" begin="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 876 336 L 876 312 M 876 336 L 852 336" stroke="#7C3AED" stroke-width="2" fill="none">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" begin="3s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>