<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%">
  <defs>
    <!-- Animated mesh gradient background -->
    <radialGradient id="orb1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#EC4899;#7C3AED" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9">
        <animate attributeName="stop-color" values="#0EA5E9;#22C55E;#0EA5E9" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb3" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3">
        <animate attributeName="stop-opacity" values="0.3;0.6;0.3" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Stronger glow for text -->
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.3"/>
    </pattern>

    <!-- Shimmer gradient for text -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="-50%" stop-color="#7C3AED"/>
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#7C3AED"/>
      <animate attributeName="x1" values="-100%;100%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="#0d1117"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Animated orbs -->
  <rect width="1200" height="400" fill="url(#orb1)"/>
  <rect width="1200" height="400" fill="url(#orb2)"/>
  <rect width="1200" height="400" fill="url(#orb3)"/>

  <!-- Floating particles -->
  <g opacity="0.4">
    <circle cx="100" cy="80" r="2" fill="#7C3AED">
      <animate attributeName="cy" values="80;60;80" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="200" r="1.5" fill="#0EA5E9">
      <animate attributeName="cy" values="200;170;200" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="120" r="2.5" fill="#EC4899">
      <animate attributeName="cy" values="120;100;120" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="280" r="1.5" fill="#22C55E">
      <animate attributeName="cy" values="280;250;280" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="150" r="2" fill="#F59E0B">
      <animate attributeName="cy" values="150;130;150" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="320" r="1.5" fill="#7C3AED">
      <animate attributeName="cy" values="320;290;320" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="350" r="2" fill="#0EA5E9">
      <animate attributeName="cy" values="350;320;350" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="50" r="1.5" fill="#EC4899">
      <animate attributeName="cy" values="50;30;50" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="380" r="2.5" fill="#22C55E">
      <animate attributeName="cy" values="380;350;380" dur="7.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="7.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Connection lines between particles -->
  <g stroke="#7C3AED" stroke-width="0.5" opacity="0.15">
    <line x1="100" y1="80" x2="300" y2="200">
      <animate attributeName="opacity" values="0.15;0.3;0.15" dur="5s" repeatCount="indefinite"/>
    </line>
    <line x1="300" y1="200" x2="500" y2="120">
      <animate attributeName="opacity" values="0.1;0.25;0.1" dur="6s" repeatCount="indefinite"/>
    </line>
    <line x1="500" y1="120" x2="700" y2="280">
      <animate attributeName="opacity" values="0.1;0.2;0.1" dur="7s" repeatCount="indefinite"/>
    </line>
    <line x1="700" y1="280" x2="900" y2="150">
      <animate attributeName="opacity" values="0.1;0.25;0.1" dur="8s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Center decorative hexagon -->
  <g transform="translate(600, 200)" opacity="0.1">
    <polygon points="0,-80 69.3,-40 69.3,40 0,80 -69.3,40 -69.3,-40" fill="none" stroke="#7C3AED" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="none" stroke="#0EA5E9" stroke-width="0.5">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="45s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Main title -->
  <text x="600" y="165" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="url(#shimmer)" filter="url(#textGlow)" letter-spacing="2">PIPELINE ORCHESTRATOR</text>

  <!-- Version badge -->
  <g transform="translate(600, 210)">
    <rect x="-60" y="0" width="120" height="28" rx="14" fill="#7C3AED" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="19" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#fff">v5.0.0</text>
  </g>

  <!-- Tagline -->
  <text x="600" y="270" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#8b949e" font-weight="400" letter-spacing="1">
    O pipeline multi-agente que pega o que humanos deixam passar
  </text>

  <!-- Stats row -->
  <g transform="translate(0, 310)">
    <text x="260" y="0" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#c4b5fd">
      19
      <animate attributeName="fill" values="#c4b5fd;#fff;#c4b5fd" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="260" y="22" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" font-weight="500">AGENTES</text>

    <text x="460" y="0" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#7dd3fc">
      12
      <animate attributeName="fill" values="#7dd3fc;#fff;#7dd3fc" dur="4s" begin="1s" repeatCount="indefinite"/>
    </text>
    <text x="460" y="22" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" font-weight="500">PIPELINES</text>

    <text x="660" y="0" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#86efac">
      166
      <animate attributeName="fill" values="#86efac;#fff;#86efac" dur="4s" begin="2s" repeatCount="indefinite"/>
    </text>
    <text x="660" y="22" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" font-weight="500">TESTES</text>

    <text x="860" y="0" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#fde68a">
      0
      <animate attributeName="fill" values="#fde68a;#fff;#fde68a" dur="4s" begin="3s" repeatCount="indefinite"/>
    </text>
    <text x="860" y="22" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" font-weight="500">DEPENDÊNCIAS</text>
  </g>

  <!-- Bottom pulse line -->
  <line x1="200" y1="370" x2="1000" y2="370" stroke="#7C3AED" stroke-width="1" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Corner accents -->
  <g opacity="0.3">
    <path d="M 30 30 L 30 60 M 30 30 L 60 30" stroke="#7C3AED" stroke-width="2" fill="none">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 1170 30 L 1170 60 M 1170 30 L 1140 30" stroke="#7C3AED" stroke-width="2" fill="none">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" begin="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 30 370 L 30 340 M 30 370 L 60 370" stroke="#7C3AED" stroke-width="2" fill="none">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" begin="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 1170 370 L 1170 340 M 1170 370 L 1140 370" stroke="#7C3AED" stroke-width="2" fill="none">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" begin="3s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>