<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <!-- Background: deep navy -> violet -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="55%" stop-color="#130b26"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>

    <!-- Brand orbs -->
    <radialGradient id="orbA" cx="22%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.55">
        <animate attributeName="stop-opacity" values="0.55;0.75;0.55" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="80%" cy="74%" r="46%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.40">
        <animate attributeName="stop-opacity" values="0.40;0.62;0.40" dur="11s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbC" cx="50%" cy="50%" r="38%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.22">
        <animate attributeName="stop-opacity" values="0.18;0.34;0.18" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid -->
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.25"/>
    </pattern>

    <!-- Title gradient -->
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#F0ABFC"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>

    <!-- Shimmer sweep over title -->
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="52%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0">
        <animate attributeName="offset" values="0.52;1.52" dur="5.5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Layers -->
  <rect width="1200" height="440" fill="url(#bg)"/>
  <rect width="1200" height="440" fill="url(#orbA)"/>
  <rect width="1200" height="440" fill="url(#orbB)"/>
  <rect width="1200" height="440" fill="url(#orbC)"/>
  <rect width="1200" height="440" fill="url(#grid)"/>

  <!-- Drifting particles -->
  <g opacity="0.55">
    <circle cx="110" cy="90" r="2" fill="#A78BFA">
      <animate attributeName="cy" values="90;72;90" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="200" r="1.6" fill="#7DD3FC">
      <animate attributeName="cy" values="200;178;200" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0.8;0.25" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="470" cy="110" r="2.4" fill="#F0ABFC">
      <animate attributeName="cy" values="110;92;110" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="660" cy="270" r="1.8" fill="#34D399">
      <animate attributeName="cy" values="270;250;270" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="150" r="2.2" fill="#FBBF24">
      <animate attributeName="cy" values="150;132;150" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0.75;0.25" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="300" r="1.7" fill="#A78BFA">
      <animate attributeName="cy" values="300;280;300" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="990" cy="70" r="1.5" fill="#7DD3FC">
      <animate attributeName="cy" values="70;54;70" dur="7.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="7.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- HUD corner brackets -->
  <g stroke="#7C3AED" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 28 28 L 28 64 M 28 28 L 64 28"/>
    <path d="M 1172 28 L 1172 64 M 1172 28 L 1136 28"/>
    <path d="M 28 412 L 28 376 M 28 412 L 64 412"/>
    <path d="M 1172 412 L 1172 376 M 1172 412 L 1136 412">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Version pill -->
  <g transform="translate(600,86)">
    <rect x="-74" y="-18" width="148" height="34" rx="17" fill="#1e1b4b" stroke="#7C3AED" stroke-width="1.5" filter="url(#soft)"/>
    <circle cx="-50" cy="0" r="4" fill="#34D399">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="6" y="5" text-anchor="middle" font-size="15" font-weight="700" fill="#E0E7FF" letter-spacing="2">v8.9.0 · 2026-06-20</text>
  </g>

  <!-- Title -->
  <text x="600" y="172" text-anchor="middle" font-size="58" font-weight="800" fill="url(#title)" letter-spacing="3">PIPELINE ORCHESTRATOR</text>
  <text x="600" y="172" text-anchor="middle" font-size="58" font-weight="800" fill="url(#shimmer)" letter-spacing="3">PIPELINE ORCHESTRATOR</text>

  <!-- Tagline -->
  <text x="600" y="214" text-anchor="middle" font-size="21" font-weight="500" fill="#C9D1D9" letter-spacing="0.6">The governance layer between your spec and your production code.</text>
  <text x="600" y="244" text-anchor="middle" font-size="16" fill="#8B949E" letter-spacing="0.4">Multi-agent · TDD · adversarial review · deterministic enforcement · observable</text>

  <!-- Metric pills -->
  <g transform="translate(600,330)">
    <!-- 49 GATES -->
    <g transform="translate(-385,0)">
      <rect x="-72" y="-30" width="144" height="60" rx="12" fill="#0c1a14" stroke="#22C55E" stroke-width="1.5" filter="url(#soft)"/>
      <text x="0" y="2" text-anchor="middle" font-size="30" font-weight="800" fill="#34D399">49</text>
      <text x="0" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#86EFAC" letter-spacing="2">GATES</text>
    </g>
    <!-- 20 AGENTS -->
    <g transform="translate(-193,0)">
      <rect x="-72" y="-30" width="144" height="60" rx="12" fill="#0c1a2e" stroke="#0EA5E9" stroke-width="1.5" filter="url(#soft)"/>
      <text x="0" y="2" text-anchor="middle" font-size="30" font-weight="800" fill="#38BDF8">20</text>
      <text x="0" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#7DD3FC" letter-spacing="2">AGENTS</text>
    </g>
    <!-- 188 TESTS -->
    <g transform="translate(0,0)">
      <rect x="-72" y="-30" width="144" height="60" rx="12" fill="#1a1228" stroke="#A78BFA" stroke-width="1.5" filter="url(#soft)"/>
      <text x="0" y="2" text-anchor="middle" font-size="30" font-weight="800" fill="#C4B5FD">188</text>
      <text x="0" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#DDD6FE" letter-spacing="2">TEST FILES</text>
    </g>
    <!-- 28 HOOKS -->
    <g transform="translate(193,0)">
      <rect x="-72" y="-30" width="144" height="60" rx="12" fill="#2a1018" stroke="#EC4899" stroke-width="1.5" filter="url(#soft)"/>
      <text x="0" y="2" text-anchor="middle" font-size="30" font-weight="800" fill="#F472B6">28</text>
      <text x="0" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#FBCFE8" letter-spacing="2">HOOKS</text>
    </g>
    <!-- Claude + Cursor -->
    <g transform="translate(385,0)">
      <rect x="-72" y="-30" width="144" height="60" rx="12" fill="#231b06" stroke="#F59E0B" stroke-width="1.5" filter="url(#soft)"/>
      <text x="0" y="-2" text-anchor="middle" font-size="15" font-weight="800" fill="#FBBF24">Claude Code</text>
      <text x="0" y="18" text-anchor="middle" font-size="13" font-weight="600" fill="#FCD34D">+ Cursor + OpenCode</text>
    </g>
  </g>

  <!-- Bottom accent line -->
  <line x1="200" y1="402" x2="1000" y2="402" stroke="#7C3AED" stroke-width="1" opacity="0.45">
    <animate attributeName="opacity" values="0.25;0.7;0.25" dur="3.5s" repeatCount="indefinite"/>
  </line>
</svg>
